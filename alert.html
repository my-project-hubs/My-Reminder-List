<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Event Alerts</title>
<style>
  :root{
    /* 100% White Background for all components */
    --bg:#ffffff;
    --card:#ffffff;
    --card-border:#ff0000;
    
    /* Text Colors */
    --text:#000000;
    --muted:#000000;
    --accent:#000000;
    --red:#ff0000; /* 100% Red for Day Left */
    --red-bg:#ffffff;
  }
  
  /* स्क्रीनशॉट वाला फ़ॉन्ट पूरी वेबसाइट के लिए */
  *, body, div, span, a, p, button {
    box-sizing:border-box; 
    -webkit-tap-highlight-color:transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  }

  body{
    margin:0;
    background: #ffffff !important;
    color: #000000 !important;
    min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);
  }

  .app{
    max-width:520px;
    margin:0 auto;
    padding:16px 16px 40px;
    position:relative;
    background: #ffffff !important;
  }

  /* Top Header Bar with Right Link */
  .top-bar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    margin-bottom: 12px;
  }
  .nav-small-link {
    color: #000000 !important;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    background: #ffffff !important;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid #000000;
  }

  /* Alert Header Box */
  .alert-box-header{
    background: #ffffff !important;
    color: #000000 !important;
    text-align: center;
    padding: 10px 0;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 1.5px;
    margin-bottom: 20px;
    border: none !important;
    box-shadow: none !important;
  }

  /* Event list */
  .event-card{
    position:relative;
    background:#ffffff !important;
    border:1px solid #ff0000;
    border-radius:14px;
    padding:16px 18px;
    margin-bottom: 96px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .event-card.warn{
    background: #ffffff !important;
    border: 2.5px solid #ff0000;
    animation: pulseRedOnly 1.2s infinite ease-in-out;
  }

  @keyframes pulseRedOnly {
    0%, 100% {
      border-color: #ff0000;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
    }
    50% {
      border-color: #ff6666;
      box-shadow: 0 0 2px rgba(255, 0, 0, 0.2);
    }
  }

  .event-name{
    font-size:25px; font-weight:600; line-height:1.3; color:#000000 !important; word-break:break-word;
  }
  .event-right{
    display:flex; flex-direction:column; align-items:flex-start; gap:6px;
  }
  
  .event-days{
    font-size:36px; font-weight:700; color:#ff0000 !important;
    display:inline-block; animation:wiggle 1.6s ease-in-out infinite;
  }
  @keyframes wiggle{
    0%, 100%{ transform:rotate(0deg) translateX(0); }
    20%{ transform:rotate(-4deg) translateX(-1px); }
    40%{ transform:rotate(4deg) translateX(1px); }
    60%{ transform:rotate(-3deg) translateX(-1px); }
    80%{ transform:rotate(3deg) translateX(1px); }
  }

  .event-date{
    font-size:18px; font-weight:600; color:#000000 !important; opacity:1; font-variant-numeric:tabular-nums; white-space:nowrap;
  }

  /* Gas Cylinder styling */
  .gas-row{ display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .gas-left{ display:flex; flex-direction:column; gap:8px; min-width:0; flex:1; }
  .cylinder-wrap-side{ flex-shrink:0; display:flex; align-items:flex-end; }
  .cylinder{ position:relative; width:68px; height:125px; transform-origin:bottom center; animation:wiggle 1.6s ease-in-out infinite; }
  .cylinder .cyl-top-collar { position:absolute; top:0; left:50%; transform:translateX(-50%); width:42px; height:12px; border:3.5px solid #c81e1e; border-radius:50%; box-shadow:inset 0 2px 3px rgba(0,0,0,0.5); }
  .cylinder .cyl-support-pillars { position:absolute; top:9px; left:50%; transform:translateX(-50%); width:40px; height:18px; }
  .cylinder .cyl-support-pillars::before, .cylinder .cyl-support-pillars::after, .cylinder .cyl-pillar-center { content:''; position:absolute; top:0; width:3.5px; height:18px; background:linear-gradient(180deg, #d32020, #961111); border-radius:1px; }
  .cylinder .cyl-support-pillars::before { left:2px; }
  .cylinder .cyl-support-pillars::after { right:2px; }
  .cylinder .cyl-pillar-center { left:50%; transform:translateX(-50%); width:3px; }
  .cylinder .cyl-valve-tag { position:absolute; top:11px; left:50%; transform:translateX(-50%); width:10px; height:14px; background:#e0d8b0; border:1px solid #a89f78; border-radius:1px; z-index:2; }
  .cylinder .cyl-valve-tag::after { content:''; position:absolute; top:5px; left:50%; transform:translateX(-50%); width:6px; height:5px; background:#e63939; border-radius:50%; }
  .cylinder .cyl-dome{ position:absolute; top:25px; left:50%; transform:translateX(-50%); width:62px; height:26px; background:radial-gradient(ellipse at top, #f03232 0%, #c81e1e 60%, #820e0e 100%); border-radius:50% 50% 0 0 / 100% 100% 0 0; box-shadow:inset 0 3px 5px rgba(255,255,255,0.3); }
  .cylinder .cyl-dome-text { position:absolute; top:33px; left:50%; transform:translateX(-50%); font-size:6px; font-weight:700; color:#000000 !important; letter-spacing:0.5px; white-space:nowrap; }
  .cylinder .cyl-body{ position:absolute; top:49px; left:50%; transform:translateX(-50%); width:64px; height:62px; background:linear-gradient(90deg, #7a0c0c 0%, #e62828 20%, #ff5252 45%, #c81e1e 75%, #520606 100%); border-radius:2px; box-shadow:inset 0 0 8px rgba(0,0,0,0.5), inset 4px 0 5px rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; }
  .cylinder .cyl-weld-line { position:absolute; top:80px; left:50%; transform:translateX(-50%); width:64px; height:2px; background:rgba(0,0,0,0.35); box-shadow:0 1px 1px rgba(255,255,255,0.15); z-index:3; }
  .cylinder .indian-gas-container { position:absolute; top:57px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:4; width:100%; }
  .cylinder .indian-text { font-weight:700; font-size:11px; letter-spacing:0.8px; color:#000000 !important; line-height:1; }
  .cylinder .cyl-foot{ position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:56px; height:14px; background:linear-gradient(180deg, #d32020, #a81616); border-radius:0 0 6px 6px; border-top:1.5px solid #820e0e; box-shadow:0 2px 4px rgba(200,30,30,0.4); display:flex; justify-content:space-around; align-items:flex-end; padding-bottom:2px; }
  .cylinder .cyl-foot-hole { width:8px; height:4px; background:#ffffff !important; border-radius:2px 2px 0 0; }

  #empty{ color:#000000 !important; font-size:18px; text-align:center; padding:40px 0; }
  .footer-info{ margin-bottom:24px; padding-bottom:16px; border-bottom:1px solid #000000; text-align:center; }
  
  #headerNote{ font-size:30px; font-weight:700; margin:0 0 10px; color:#0000ff !important; white-space: pre-wrap; }
  
  #status{ font-size:24px; color:#ff6600 !important; font-weight:700; }
</style>
</head>
<body>
<div class="app">

  <div class="top-bar">
    <a href="list.html" class="nav-small-link">List</a>
  </div>

  <div class="footer-info">
    <div id="headerNote"></div>
    <div id="status">Loading...</div>
  </div>

  <div class="alert-box-header">ALERTS</div>

  <div id="list"></div>
  <div id="empty" style="display:none;">No Alerts (No events under 15 days)</div>

</div>

<script>
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQhnQJrsY7BIuA3h5iMxaU3-yr3J9skyPtSSL_YoQfmYYQYXfPFnGWDH1loxyXC3mtl9-PS-oLa5_0n/pub?output=csv";
const REFRESH_MS = 3000;
const ALERT_THRESHOLD = 15;
const GAS_ALERT_DAYS = 90;

function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length && r.some(v => v !== ""));
}

function extractDayLeftNumber(text){
  const m = text.match(/(\d+)\s*\.\s*Day\s*Left/i);
  return m ? parseInt(m[1], 10) : null;
}

// Gas Cylinder ke liye: "3 . Months - 21 . Days" jaise text se total din nikalta hai
function extractGasTotalDays(text){
  const mFull = text.match(/(\d+)\s*\.?\s*Months?\s*-\s*(\d+)\s*\.?\s*Days?/i);
  if(mFull){
    const months = parseInt(mFull[1], 10);
    const days = parseInt(mFull[2], 10);
    return (months * 30) + days;
  }
  const mDaysOnly = text.match(/(\d+)\s*\.?\s*Days?/i);
  if(mDaysOnly){
    return parseInt(mDaysOnly[1], 10);
  }
  const mNum = text.match(/(\d+)/);
  return mNum ? parseInt(mNum[1], 10) : null;
}

let lastDataKey = null;

async function loadData(){
  const statusEl = document.getElementById("status");
  const listEl = document.getElementById("list");
  const emptyEl = document.getElementById("empty");
  const headerNoteEl = document.getElementById("headerNote");

  try{
    const res = await fetch(SHEET_CSV_URL + "&cachebust=" + Date.now(), {cache:"no-store"});
    if(!res.ok) throw new Error("Sheet fetch failed: " + res.status);
    const text = await res.text();
    const rows = parseCSV(text);

    const colB = rows.map(r => (r[1] || "").trim()).filter(v => v !== "");

    if(colB.length === 0){
      emptyEl.style.display = "block";
      listEl.innerHTML = "";
      statusEl.textContent = "No data found";
      return;
    }

    const dataKey = colB.join("\u0001");
    if(dataKey === lastDataKey) return;
    lastDataKey = dataKey;

    let idx = 0;
    let headerLine = "";
    if(colB.length % 3 !== 0){
      headerLine = colB[0];
      idx = 1;
    }

    const alertEvents = [];
    for(; idx < colB.length; idx += 3){
      const name = colB[idx] || "";
      const days = colB[idx + 1] || "";
      const date = colB[idx + 2] || "";
      if(!name) continue;

      const isGasCylinder = name.trim().toLowerCase() === "gas cylinder";

      if(isGasCylinder){
        const totalDays = extractGasTotalDays(days);
        if(totalDays !== null && totalDays >= GAS_ALERT_DAYS){
          alertEvents.push({name, days, date});
        }
      } else {
        const dayNum = extractDayLeftNumber(days);
        if(dayNum !== null && dayNum <= ALERT_THRESHOLD){
          alertEvents.push({name, days, date});
        }
      }
    }

    headerNoteEl.textContent = headerLine.replace(/(\d{2}\/\d{2}\/\d{4})\s*(\([A-Za-z]+\))/, '$1  $2');

    listEl.innerHTML = "";
    if(alertEvents.length === 0){
      emptyEl.style.display = "block";
    } else {
      emptyEl.style.display = "none";
      alertEvents.forEach(ev => {
        const isGasCylinder = ev.name.trim().toLowerCase() === "gas cylinder";
        const card = document.createElement("div");
        card.className = "event-card warn";

        const rightHTML = isGasCylinder ? `
          <div class="cylinder-wrap-side">
            <div class="cylinder">
              <div class="cyl-top-collar"></div>
              <div class="cyl-support-pillars"><div class="cyl-pillar-center"></div></div>
              <div class="cyl-valve-tag"></div>
              <div class="cyl-dome"></div>
              <div class="cyl-dome-text">14.2 kg</div>
              <div class="cyl-body"></div>
              <div class="cyl-weld-line"></div>
              <div class="indian-gas-container"><div class="indian-text">INDIAN</div></div>
              <div class="cyl-foot">
                <div class="cyl-foot-hole"></div><div class="cyl-foot-hole"></div><div class="cyl-foot-hole"></div>
              </div>
            </div>
          </div>
        ` : `
          <div class="event-right">
            <div class="event-days">${ev.days}</div>
            <div class="event-date">${ev.date}</div>
          </div>
        `;

        if(isGasCylinder){
          card.innerHTML = `
            <div class="gas-row">
              <div class="gas-left">
                <div class="event-name">${ev.name}</div>
                <div class="event-right">
                  <div class="event-days">${ev.days}</div>
                  <div class="event-date">${ev.date}</div>
                </div>
              </div>
              ${rightHTML}
            </div>
          `;
        } else {
          card.innerHTML = `
            <div class="event-name">${ev.name}</div>
            ${rightHTML}
          `;
        }
        listEl.appendChild(card);
      });
    }

    statusEl.textContent = "Total Alerts: " + alertEvents.length;

  } catch(err){
    statusEl.textContent = "Error loading data: " + err.message;
    console.error(err);
  }
}

loadData();
setInterval(loadData, REFRESH_MS);
</script>

</body>
  </html>
