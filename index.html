<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validity Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #333;
      margin: 0;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .today-header {
      font-size: 18px;
      font-weight: normal;
      margin-top: 10px;
      margin-bottom: 35px;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 400px;
    }

    .item-card {
      margin-bottom: 30px;
    }

    .item-title {
      font-size: 17px;
      font-weight: 500;
      color: #222;
      margin-bottom: 6px;
    }

    .days-left {
      font-size: 22px;
      font-weight: bold;
      color: #d30000;
      margin-bottom: 4px;
    }

    .target-date {
      font-size: 13px;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="today-header" id="today-date">Today - Loading...</div>

  <div class="container" id="list-container"></div>

  <!-- Firebase JavaScript SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // आपकी Firebase सेटिंग्स
    const firebaseConfig = {
      apiKey: "AIzaSyAynuPWAbwu6etjBTqBejpppw4S4umoKPM",
      authDomain: "my-tracker-d4776.firebaseapp.com",
      databaseURL: "https://my-tracker-d4776-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "my-tracker-d4776",
      storageBucket: "my-tracker-d4776.firebasestorage.app",
      messagingSenderId: "207196018290",
      appId: "1:207196018290:web:e544ccd2eac3e84150d4eb",
      measurementId: "G-HPDX62VBWK"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // आज की लाइव तारीख दिखाने का लॉजिक
    function displayTodayHeader() {
      const today = new Date();
      const dd = String(today.getDate()).padStart(2, '0');
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const yyyy = today.getFullYear();
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const dayName = days[today.getDay()];

      document.getElementById('today-date').innerText = `Today - ${dd}/${mm}/${yyyy} (${dayName})`;
    }
    displayTodayHeader();

    // ऑटोमैटिक उल्टी गिनती (Days Left) निकालने का लॉजिक
    function calculateDaysLeft(targetDateStr) {
      let targetDate;

      if (targetDateStr.includes('/')) {
        const parts = targetDateStr.split('/');
        targetDate = new Date(parts[2], parts[1] - 1, parts[0]);
      } else {
        targetDate = new Date(targetDateStr);
      }

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      targetDate.setHours(0, 0, 0, 0);

      const diffTime = targetDate - today;
      return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    }

    function formatDateForDisplay(targetDateStr) {
      if (targetDateStr.includes('/')) return targetDateStr;
      const parts = targetDateStr.split('-');
      if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
      return targetDateStr;
    }

    // Firebase से ऑटो-सिंक: नया डेटा आते ही अपने आप अपडेट होगा
    const itemsRef = ref(db, 'items');
    onValue(itemsRef, (snapshot) => {
      const data = snapshot.val();
      const container = document.getElementById('list-container');
      container.innerHTML = '';

      if (data) {
        const itemList = Array.isArray(data) ? data : Object.values(data);

        itemList.forEach(item => {
          if (item && item.title && item.targetDate) {
            
            const daysLeft = calculateDaysLeft(item.targetDate);
            const formattedDate = formatDateForDisplay(item.targetDate);

            let daysText = "";
            if (daysLeft < 0) {
              daysText = "Expired";
            } else {
              daysText = `${daysLeft} . Day Left`;
            }

            const cardHTML = `
              <div class="item-card">
                <div class="item-title">${item.title}</div>
                <div class="days-left">${daysText}</div>
                <div class="target-date">${formattedDate}</div>
              </div>
            `;
            container.innerHTML += cardHTML;
          }
        });
      } else {
        container.innerHTML = '<div style="text-align:center; color:#777;">कोई डेटा नहीं मिला।</div>';
      }
    });
  </script>

</body>
</html>
