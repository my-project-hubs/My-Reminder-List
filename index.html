<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reminders</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: #ffffff;
    color: #000000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    padding: 24px 20px 80px;
    max-width: 640px;
    margin: 0 auto;
  }

  .nav {
    display: flex;
    justify-content: flex-end;
    gap: 20px;
    margin-bottom: 24px;
    font-size: 15px;
  }

  .nav button {
    background: none;
    border: none;
    color: #e6e6e6;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    padding: 0 0 4px 0;
    border-bottom: 2px solid transparent;
  }

  .nav button.active {
    border-bottom: 2px solid #d40000;
    font-weight: 600;
  }

  .header-date {
    font-size: var(--header-size, 19px);
    color: var(--header-color, #000000);
    font-family: var(--header-font, inherit);
    font-weight: var(--header-weight, 400);
    margin-bottom: 28px;
  }

  .event {
    margin-bottom: 22px;
  }

  .event-name {
    color: var(--name-color, #000000);
    font-size: var(--name-size, 20px);
    font-family: var(--name-font, inherit);
    font-weight: var(--name-weight, 400);
    margin-bottom: 4px;
  }

  .event-countdown {
    color: var(--countdown-color, #ff0000);
    font-size: var(--countdown-size, 26px);
    font-family: var(--countdown-font, inherit);
    font-weight: var(--countdown-weight, 700);
    margin-bottom: 2px;
  }

  .event-date {
    color: var(--date-color, #000000);
    font-size: var(--date-size, 15px);
    font-family: var(--date-font, inherit);
    font-weight: var(--date-weight, 400);
  }

  #page-alerts .header-date {
    text-align: center;
  }

  #list-alerts {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #list-alerts .event {
    text-align: left;
  }

  .empty-state {
    color: #555;
    font-size: 16px;
    margin-top: 12px;
  }

  .loading {
    color: #555;
  }

  .page {
    display: none;
  }

  .page.active {
    display: block;
  }

  /* ---------- Settings icon: bottom-right, barely visible ---------- */
  .settings-icon {
    position: fixed;
    bottom: 16px;
    right: 16px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #ffffff;
    color: #e6e6e6;
    border: 1px solid #f0f0f0;
    font-size: 17px;
    cursor: pointer;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .settings-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 30;
    align-items: flex-end;
    justify-content: center;
  }

  .settings-overlay.open {
    display: flex;
  }

  .settings-panel {
    background: #ffffff;
    width: 100%;
    max-width: 640px;
    max-height: 85vh;
    overflow-y: auto;
    border-radius: 16px 16px 0 0;
    padding: 20px;
  }

  .settings-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
  }

  .settings-title button {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: #000000;
  }

  .settings-page-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .cfgtab {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ddd;
    background: #f5f5f5;
    color: #000;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .cfgtab.active {
    background: #d40000;
    color: #ffffff;
    border-color: #d40000;
  }

  .settings-row {
    border-top: 1px solid #eee;
    padding: 14px 0;
  }

  .settings-row-label {
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 10px;
  }

  .settings-controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  .settings-controls label {
    font-size: 12px;
    color: #555;
    display: block;
    margin-bottom: 2px;
  }

  .settings-field {
    display: flex;
    flex-direction: column;
  }

  .settings-field input[type="number"] {
    width: 64px;
    padding: 6px;
    border: 1px solid #ccc;
    border-radius: 6px;
  }

  .settings-field select {
    padding: 6px;
    border: 1px solid #ccc;
    border-radius: 6px;
    max-width: 140px;
  }

  .color-swatch {
    width: 44px;
    height: 34px;
    border: 1px solid #ccc;
    border-radius: 6px;
    cursor: pointer;
    padding: 0;
  }

  .settings-field-bold {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .settings-field-bold input[type="checkbox"] {
    width: 20px;
    height: 20px;
    margin-top: 4px;
  }

  .settings-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }

  .settings-actions button {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-weight: 700;
    cursor: pointer;
  }

  .settings-apply {
    background: #d40000;
    color: #ffffff;
  }

  .settings-reset {
    background: #eee;
    color: #000000;
  }

  /* ---------- Custom color picker ---------- */
  .cp-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 40;
    align-items: center;
    justify-content: center;
  }

  .cp-overlay.open {
    display: flex;
  }

  .cp-panel {
    background: #ffffff;
    width: 90%;
    max-width: 360px;
    border-radius: 14px;
    padding: 20px;
  }

  .cp-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 14px;
    text-align: center;
  }

  .cp-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }

  .cp-tile {
    width: 100%;
    aspect-ratio: 1 / 1;
    border: 1px solid #999;
    border-radius: 6px;
    cursor: pointer;
  }

  .cp-tile-rainbow {
    background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
  }

  .cp-spectrum {
    display: none;
    margin-bottom: 16px;
  }

  .cp-spectrum.open {
    display: block;
  }

  .cp-canvas {
    width: 100%;
    height: 160px;
    border-radius: 8px;
    touch-action: none;
    display: block;
  }

  .cp-hue {
    width: 100%;
    height: 22px;
    margin-top: 10px;
    -webkit-appearance: none;
    appearance: none;
    border-radius: 11px;
    background: linear-gradient(to right, red, yellow, lime, cyan, blue, magenta, red);
  }

  .cp-hue::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #ffffff;
    border: 2px solid #333;
  }

  .cp-preview-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 16px;
  }

  .cp-preview {
    width: 50px;
    height: 34px;
    border: 1px solid #999;
    border-radius: 6px;
  }

  .cp-actions {
    display: flex;
    gap: 10px;
  }

  .cp-actions button {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-weight: 700;
    cursor: pointer;
  }

  .cp-cancel {
    background: #eee;
    color: #000;
  }

  .cp-set {
    background: #d40000;
    color: #fff;
  }
</style>
</head>
<body>

<button class="settings-icon" onclick="openSettings()" title="Settings">⚙</button>

<div id="settingsOverlay" class="settings-overlay">
  <div class="settings-panel">
    <div class="settings-title">
      <span>Settings</span>
      <button onclick="closeSettings()">✕</button>
    </div>

    <div class="settings-page-tabs">
      <button id="cfgtab-alerts" class="cfgtab active" onclick="switchConfigTab('alerts')">Alerts Page</button>
      <button id="cfgtab-data" class="cfgtab" onclick="switchConfigTab('data')">List Page</button>
    </div>

    <div class="settings-row">
      <div class="settings-row-label">Date Header (Today - ...)</div>
      <div class="settings-controls">
        <div class="settings-field">
          <label>Size</label>
          <input type="number" id="header-size" min="8" max="60">
        </div>
        <div class="settings-field">
          <label>Color</label>
          <button type="button" class="color-swatch" id="header-color-swatch" onclick="openColorPicker('header')"></button>
        </div>
        <div class="settings-field">
          <label>Style</label>
          <select id="header-font"></select>
        </div>
        <div class="settings-field-bold">
          <label>Bold</label>
          <input type="checkbox" id="header-bold">
        </div>
      </div>
    </div>

    <div class="settings-row">
      <div class="settings-row-label">Name (e.g. V! Recharge)</div>
      <div class="settings-controls">
        <div class="settings-field">
          <label>Size</label>
          <input type="number" id="name-size" min="8" max="60">
        </div>
        <div class="settings-field">
          <label>Color</label>
          <button type="button" class="color-swatch" id="name-color-swatch" onclick="openColorPicker('name')"></button>
        </div>
        <div class="settings-field">
          <label>Style</label>
          <select id="name-font"></select>
        </div>
        <div class="settings-field-bold">
          <label>Bold</label>
          <input type="checkbox" id="name-bold">
        </div>
      </div>
    </div>

    <div class="settings-row">
      <div class="settings-row-label">Day Left (red line)</div>
      <div class="settings-controls">
        <div class="settings-field">
          <label>Size</label>
          <input type="number" id="countdown-size" min="8" max="60">
        </div>
        <div class="settings-field">
          <label>Color</label>
          <button type="button" class="color-swatch" id="countdown-color-swatch" onclick="openColorPicker('countdown')"></button>
        </div>
        <div class="settings-field">
          <label>Style</label>
          <select id="countdown-font"></select>
        </div>
        <div class="settings-field-bold">
          <label>Bold</label>
          <input type="checkbox" id="countdown-bold">
        </div>
      </div>
    </div>

    <div class="settings-row">
      <div class="settings-row-label">Date</div>
      <div class="settings-controls">
        <div class="settings-field">
          <label>Size</label>
          <input type="number" id="date-size" min="8" max="60">
        </div>
        <div class="settings-field">
          <label>Color</label>
          <button type="button" class="color-swatch" id="date-color-swatch" onclick="openColorPicker('date')"></button>
        </div>
        <div class="settings-field">
          <label>Style</label>
          <select id="date-font"></select>
        </div>
        <div class="settings-field-bold">
          <label>Bold</label>
          <input type="checkbox" id="date-bold">
        </div>
      </div>
    </div>

    <div class="settings-actions">
      <button class="settings-reset" onclick="resetSettings()">Reset (this page)</button>
      <button class="settings-apply" onclick="applySettings()">Apply</button>
    </div>
  </div>
</div>

<!-- Custom color picker popup -->
<div id="cpOverlay" class="cp-overlay">
  <div class="cp-panel">
    <div class="cp-title">Select color</div>

    <div class="cp-grid" id="cpGrid">
      <button type="button" class="cp-tile" style="background:#ff0000" onclick="cpPickPreset('#ff0000')"></button>
      <button type="button" class="cp-tile" style="background:#00ffff" onclick="cpPickPreset('#00ffff')"></button>
      <button type="button" class="cp-tile" style="background:#0000ff" onclick="cpPickPreset('#0000ff')"></button>
      <button type="button" class="cp-tile" style="background:#00ff00" onclick="cpPickPreset('#00ff00')"></button>
      <button type="button" class="cp-tile" style="background:#ff00ff" onclick="cpPickPreset('#ff00ff')"></button>
      <button type="button" class="cp-tile" style="background:#ffff00" onclick="cpPickPreset('#ffff00')"></button>
      <button type="button" class="cp-tile" style="background:#000000" onclick="cpPickPreset('#000000')"></button>
      <button type="button" class="cp-tile" style="background:#ffffff" onclick="cpPickPreset('#ffffff')"></button>
      <button type="button" class="cp-tile cp-tile-rainbow" onclick="cpOpenSpectrum()"></button>
    </div>

    <div class="cp-spectrum" id="cpSpectrum">
      <canvas class="cp-canvas" id="cpCanvas"></canvas>
      <input type="range" class="cp-hue" id="cpHue" min="0" max="360" value="0">
    </div>

    <div class="cp-preview-row">
      <span>Chosen color</span>
      <div class="cp-preview" id="cpPreview"></div>
    </div>

    <div class="cp-actions">
      <button class="cp-cancel" onclick="closeColorPicker()">Cancel</button>
      <button class="cp-set" onclick="cpConfirm()">Set</button>
    </div>
  </div>
</div>

<div class="nav">
  <button id="tab-alerts" class="active" onclick="showPage('alerts')">Alerts</button>
  <button id="tab-data" onclick="showPage('data')">List</button>
</div>

<!-- PAGE 1: Alerts -->
<div id="page-alerts" class="page active">
  <div id="header-alerts" class="header-date"></div>
  <div id="list-alerts"><div class="loading">Loading...</div></div>
</div>

<!-- PAGE 2: All Data -->
<div id="page-data" class="page">
  <div id="header-data" class="header-date"></div>
  <div id="list-data"><div class="loading">Loading...</div></div>
</div>

<script>
// ============================================================
// SETTINGS - agar aage Google Sheet ka link badalna ho to yahan
// ============================================================
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQhnQJrsY7BIuA3h5iMxaU3-yr3J9skyPtSSL_YoQfmYYQYXfPFnGWDH1loxyXC3mtl9-PS-oLa5_0n/pub?output=csv";
const ALERT_THRESHOLD_DAYS = 15;
const CYLINDER_THRESHOLD_MONTHS = 3;

// ============================================================
// Tab switching (Alerts / List)
// ============================================================
function showPage(name) {
  document.getElementById("page-alerts").classList.toggle("active", name === "alerts");
  document.getElementById("page-data").classList.toggle("active", name === "data");
  document.getElementById("tab-alerts").classList.toggle("active", name === "alerts");
  document.getElementById("tab-data").classList.toggle("active", name === "data");
  localStorage.setItem("activePage", name);
}

const savedPage = localStorage.getItem("activePage");
if (savedPage === "data" || savedPage === "alerts") {
  showPage(savedPage);
}

// ============================================================
// CSV parsing - Column B only, groups of 3 lines per event
// ============================================================
function parseSheetCSV(csvText) {
  const rawLines = csvText.split("\n");

  const values = rawLines.map((line) => {
    const idx = line.indexOf(",");
    const col = idx === -1 ? "" : line.slice(idx + 1);
    return col.replace(/\r/g, "").trim();
  });

  const nonEmpty = values.filter((v) => v.length > 0);
  if (nonEmpty.length === 0) {
    return { header: "", events: [] };
  }

  const header = nonEmpty[0];
  const rest = nonEmpty.slice(1);

  const events = [];
  for (let i = 0; i < rest.length; i += 3) {
    const name = rest[i];
    const countdown = rest[i + 1];
    const date = rest[i + 2];
    if (!name || !countdown) continue;

    const dayMatch = countdown.match(/^(\d+)\s*\.\s*Day Left/i);
    const monthMatch = countdown.match(/^(\d+)\s*\.\s*Months\s*-\s*(\d+)\s*\.\s*Days/i);

    let days = null;
    let isDayFormat = false;
    let isMonthFormat = false;
    let monthsElapsed = null;
    let daysElapsed = null;

    if (dayMatch) {
      days = parseInt(dayMatch[1], 10);
      isDayFormat = true;
    } else if (monthMatch) {
      monthsElapsed = parseInt(monthMatch[1], 10);
      daysElapsed = parseInt(monthMatch[2], 10);
      isMonthFormat = true;
    }

    events.push({ name, countdown, date, days, isDayFormat, isMonthFormat, monthsElapsed, daysElapsed });
  }

  return { header, events };
}

async function fetchSheetData() {
  const response = await fetch(SHEET_CSV_URL, { cache: "no-store" });
  if (!response.ok) throw new Error("Network response was not ok");
  const text = await response.text();
  return parseSheetCSV(text);
}

// ============================================================
// Rendering
// ============================================================
function renderEvents(container, events) {
  container.innerHTML = "";
  events.forEach((e) => {
    const item = document.createElement("div");
    item.className = "event";
    item.innerHTML = `
      <div class="event-name">${e.name}</div>
      <div class="event-countdown">${e.countdown}</div>
      <div class="event-date">${e.date}</div>
    `;
    container.appendChild(item);
  });
}

async function loadAll() {
  const headerAlerts = document.getElementById("header-alerts");
  const listAlerts = document.getElementById("list-alerts");
  const headerData = document.getElementById("header-data");
  const listData = document.getElementById("list-data");

  try {
    const { header, events } = await fetchSheetData();

    headerAlerts.textContent = header;
    headerData.textContent = header;

    renderEvents(listData, events);

    const alerts = events.filter((e) => {
      if (e.isDayFormat && e.days !== null) {
        return e.days <= ALERT_THRESHOLD_DAYS;
      }
      if (e.isMonthFormat && e.monthsElapsed !== null) {
        return e.monthsElapsed >= CYLINDER_THRESHOLD_MONTHS;
      }
      return false;
    });

    if (alerts.length === 0) {
      listAlerts.innerHTML = '<div class="empty-state">No alerts right now.</div>';
    } else {
      renderEvents(listAlerts, alerts);
    }
  } catch (err) {
    const msg = '<div class="empty-state">Could not load data. Please try again later.</div>';
    listAlerts.innerHTML = msg;
    listData.innerHTML = msg;
  }
}

loadAll();
setInterval(loadAll, 3000);

// ============================================================
// Font style options (20 total, simple styles only)
// ============================================================
const FONT_OPTIONS = [
  { label: "Default", value: "inherit" },
  { label: "Arial", value: "Arial, sans-serif" },
  { label: "Helvetica", value: "Helvetica, Arial, sans-serif" },
  { label: "Verdana", value: "Verdana, sans-serif" },
  { label: "Tahoma", value: "Tahoma, sans-serif" },
  { label: "Trebuchet MS", value: "'Trebuchet MS', sans-serif" },
  { label: "Segoe UI", value: "'Segoe UI', sans-serif" },
  { label: "Calibri", value: "Calibri, sans-serif" },
  { label: "Century Gothic", value: "'Century Gothic', sans-serif" },
  { label: "Franklin Gothic", value: "'Franklin Gothic Medium', sans-serif" },
  { label: "Arial Black", value: "'Arial Black', sans-serif" },
  { label: "Georgia", value: "Georgia, serif" },
  { label: "Times New Roman", value: "'Times New Roman', serif" },
  { label: "Garamond", value: "Garamond, serif" },
  { label: "Palatino", value: "'Palatino Linotype', serif" },
  { label: "Book Antiqua", value: "'Book Antiqua', serif" },
  { label: "Cambria", value: "Cambria, serif" },
  { label: "Courier New", value: "'Courier New', monospace" },
  { label: "Lucida Console", value: "'Lucida Console', monospace" },
  { label: "Consolas", value: "Consolas, monospace" }
];

function populateFontSelects() {
  ["header-font", "name-font", "countdown-font", "date-font"].forEach((id) => {
    const sel = document.getElementById(id);
    sel.innerHTML = "";
    FONT_OPTIONS.forEach((opt) => {
      const o = document.createElement("option");
      o.value = opt.value;
      o.textContent = opt.label;
      sel.appendChild(o);
    });
  });
}
populateFontSelects();

// ============================================================
// Per-page font Settings (size, co
