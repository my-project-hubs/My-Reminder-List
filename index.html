  #page-alerts .header-date, #page-data .header-date {

    max-width: 640px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .page-toggle-btn {
    position: fixed;
    top: 50%;
    right: 0;
    transform: translateY(calc(-50% - 144px));

    height: 48px;

  .settings-icon {

    top: 50%;

    height: 48px;

    justify-content: center;
  }

  .settings-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 30; align-items: flex-end; justify-content: center; }
  .settings-overlay.open { display: flex; }
  .settings-panel { background: #ffffff; width: 100%; max-width: 640px; max-height: 85vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 20px; }
  .settings-title { display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: 700; margin-bottom: 16px; }
  .settings-title button { background: none; border: none; font-size: 20px; cursor: pointer; color: #000000; }
  .settings-page-tabs { display: flex; gap: 8px; margin-bottom: 16px; }

  .cfgtab.active { background: #d40000; color: #ffffff; border-color: #d40000; }
  .settings-row { border-top: 1px solid #eee; padding: 14px 0; }
  .settings-row-label { font-weight: 600; font-size: 15px; margin-bottom: 10px; }
  .settings-row-label-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .settings-row-label-flex .settings-row-label { margin-bottom: 0; }
  .settings-row-close { background: none; border: none; font-size: 20px; font-weight: 700; cursor: pointer; color: #000000; padding: 0; line-height: 1; }
  .settings-controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: center; }
  .settings-controls label { font-size: 24px; color: #555; display: block; margin-bottom: 2px; text-align: center; }
  .settings-controls label.lbl-sm { font-size: 22px; }
  .settings-field { display: flex; flex-direction: column; align-items: center; }
  .settings-field input[type="number"] { width: 64px; padding: 6px; border: 1px solid #ccc; border-radius: 6px; font-size: 22px; }
  .settings-field select { padding: 6px; border: 1px solid #ccc; border-radius: 6px; max-width: 140px; font-size: 18px; }
  .color-combo { display: flex; gap: 6px; align-items: center; justify-content: center; }
  .color-combo input[type="color"] { width: 34px; height: 34px; padding: 0; border: 1px solid #ccc; border-radius: 6px; }

  .settings-row:has(#header-size), .settings-row:has(#name-size), .settings-row:has(#countdown-size), .settings-row:has(#date-size) { border: 1px solid #555555; border-top: 1px solid #555555; border-radius: 6px; padding: 8px 10px; margin-bottom: 10px; }

  /* Gas Cylinder graphic */
  .gas-row{ display:flex; align-items:center; justify-content:space-between; gap:14px; width:100%; }
  .gas-left{ display:flex; flex-direction:column; gap:8px; min-width:0; flex:1; }
  .cylinder-wrap-side{ flex-shrink:0; display:flex; align-items:center; margin-top:14px; }
  #list-data .cylinder-wrap-side{ margin-top:34px; margin-left:-216px; }

  /* Element-level continuous animations (loop forever, applied per element via Settings) */
  @keyframes anim-pulse { 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.09); } }
  @keyframes anim-glow { 0%,100%{ text-shadow:0 0 4px currentColor, 0 0 8px currentColor; } 50%{ text-shadow:0 0 14px currentColor, 0 0 26px currentColor; } }
  @keyframes anim-float { 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-7px); } }
  @keyframes anim-wobble { 0%,100%{ transform:rotate(0deg); } 25%{ transform:rotate(-5deg); } 75%{ transform:rotate(5deg); } }
  @keyframes anim-heartbeat { 0%,100%{ transform:scale(1); } 15%{ transform:scale(1.16); } 30%{ transform:scale(1); } 45%{ transform:scale(1.16); } 60%{ transform:scale(1); } }
  @keyframes anim-flicker { 0%,19%,21%,23%,25%,54%,56%,100%{ opacity:1; } 20%,22%,24%,55%{ opacity:0.3; } }
  @keyframes anim-rainbow { 0%{ filter:hue-rotate(0deg); } 100%{ filter:hue-rotate(360deg); } }
  @keyframes anim-swing { 0%,100%{ transform:rotate(0deg); } 20%{ transform:rotate(11deg); } 40%{ transform:rotate(-9deg); } 60%{ transform:rotate(6deg); } 80%{ transform:rotate(-3deg); } }
  @keyframes anim-shake { 0%,100%{ transform:translateX(0); } 10%,30%,50%,70%,90%{ transform:translateX(-2.5px); } 20%,40%,60%,80%{ transform:translateX(2.5px); } }
  @keyframes anim-shimmer { 0%{ background-position:-200% 0; } 100%{ background-position:200% 0; } }
  .anim-pulse{ animation: anim-pulse var(--anim-dur, 1.8s) ease-in-out infinite; }
  .anim-glow{ animation: anim-glow var(--anim-dur, 2s) ease-in-out infinite; }
  .anim-float{ animation: anim-float var(--anim-dur, 2.4s) ease-in-out infinite; }
  .anim-wobble{ animation: anim-wobble var(--anim-dur, 2s) ease-in-out infinite; display:inline-block; }
  .anim-heartbeat{ animation: anim-heartbeat var(--anim-dur, 1.2s) ease-in-out infinite; display:inline-block; }
  .anim-flicker{ animation: anim-flicker var(--anim-dur, 2.6s) linear infinite; }
  .anim-rainbow{ animation: anim-rainbow var(--anim-dur, 3s) linear infinite; }
  .anim-swing{ animation: anim-swing var(--anim-dur, 2.2s) ease-in-out infinite; display:inline-block; transform-origin: top center; }
  .anim-shake{ animation: anim-shake var(--anim-dur, 0.6s) linear infinite; display:inline-block; }
  .anim-shimmer{
    background: linear-gradient(90deg, currentColor 0%, currentColor 40%, rgba(255,255,255,0.85) 50%, currentColor 60%, currentColor 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: anim-shimmer var(--anim-dur, 2.5s) linear infinite;
  }
  .header-divider{ position:absolute; left:20px; right:20px; bottom:0; height:2px; background:#e75480; }

    60%{ transform:rotate(-3deg) translateX(-1px); }

  }

  .cylinder .cyl-support-pillars { position:absolute; top:7px; left:50%; transform:translateX(-50%); width:29px; height:14px; }
  .cylinder .cyl-support-pillars::before, .cylinder .cyl-support-pillars::after, .cylinder .cyl-pillar-center { content:''; position:absolute; top:0; width:2.5px; height:14px; background:linear-gradient(180deg, #d32020, #961111); border-radius:1px; }
  .cylinder .cyl-support-pillars::before { left:2px; }
  .cylinder .cyl-support-pillars::after { right:2px; }
  .cylinder .cyl-pillar-center { left:50%; transform:translateX(-50%); width:2.5px; }
  .cylinder .cyl-valve-tag { position:absolute; top:9px; left:50%; transform:translateX(-50%); width:8px; height:10px; background:#e0d8b0; border:1px solid #a89f78; border-radius:1px; z-index:2; }
  .cylinder .cyl-valve-tag::after { content:''; position:absolute; top:3px; left:50%; transform:translateX(-50%); width:4px; height:4px; background:#e63939; border-radius:50%; }
  .cylinder .cyl-dome{ position:absolute; top:19px; left:50%; transform:translateX(-50%); width:46px; height:20px; background:radial-gradient(ellipse at top, #f03232 0%, #c81e1e 60%, #820e0e 100%); border-radius:50% 50% 0 0 / 100% 100% 0 0; box-shadow:inset 0 3px 5px rgba(255,255,255,0.3); }
  .cylinder .cyl-dome-text { position:absolute; top:25px; left:50%; transform:translateX(-50%); font-size:5.5px; font-weight:700; color:rgba(0,0,0,0.6); letter-spacing:0.4px; white-space:nowrap; }
  .cylinder .cyl-body{ position:absolute; top:38px; left:50%; transform:translateX(-50%); width:48px; height:44px; background:linear-gradient(90deg, #7a0c0c 0%, #e62828 20%, #ff5252 45%, #c81e1e 75%, #520606 100%); border-radius:2px; box-shadow:inset 0 0 8px rgba(0,0,0,0.5), inset 4px 0 5px rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; }
  .cylinder .cyl-weld-line { position:absolute; top:60px; left:50%; transform:translateX(-50%); width:48px; height:2px; background:rgba(0,0,0,0.35); box-shadow:0 1px 1px rgba(255,255,255,0.15); z-index:3; }
  .cylinder .indian-gas-container { position:absolute; top:44px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:4; width:100%; }

  .cylinder .cyl-foot{ position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:42px; height:10px; background:linear-gradient(180deg, #d32020, #a81616); border-radius:0 0 6px 6px; border-top:1.5px solid #820e0e; display:flex; justify-content:space-around; align-items:flex-end; padding-bottom:2px; }
  .cylinder .cyl-foot-hole { width:7px; height:3px; background:#f8f9fa; border-radius:2px 2px 0 0; }
</style>

<body>

<script>

let CYLINDER_THRESHOLD_VALUE = 3.00;

const firebaseConfig = {

  authDomain: "my-tracker-d4776.firebaseapp.com",
  databaseURL: "https://my-tracker-d4776-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "my-tracker-d4776",
  storageBucket: "my-tracker-d4776.firebasestorage.app",
  messagingSenderId: "207196018290",
  appId: "1:207196018290:web:e544ccd2eac3e84150d4eb",
  measurementId: "G-HPDX62VBWK"
};

let settingsRef = null;
let eventsRef = null;
try {
  firebase.initializeApp(firebaseConfig);
  settingsRef = firebase.database().ref("settings");
  eventsRef = firebase.database().ref("remindersData/events");
} catch (e) {
  console.error("Firebase init failed:", e);
}

function saveCloudSettings(data) {
  if (!settingsRef) return Promise.reject(new Error("Firebase not available"));
  return settingsRef.set(data);
}

function setSyncStatus(text) {
  const el = document.getElementById("syncStatus");
  if (el) el.textContent = text;
}

function getActivePageName() {
  return document.getElementById("page-alerts").classList.contains("active") ? "alerts" : "data";
}

function showPage(name) {
  document.getElementById("page-alerts").classList.toggle("active", name === "alerts");
  document.getElementById("page-data").classList.toggle("active", name === "data");
  sessionStorage.setItem("activePage", name);
  applyPageBackground(name);
  applyPageAnimation(name);
}

let toggleIconRotation = 0;
function togglePage() {
  const next = getActivePageName() === "alerts" ? "data" : "alerts";
  showPage(next);
  toggleIconRotation += 180;
  document.getElementById("toggleIcon").style.transform = "rotate(" + toggleIconRotation + "deg)";
}

function parseEventDateString(dateStr) {
  const parts = String(dateStr).trim().split(/[-.\/]/).map((p) => parseInt(p, 10));
  if (parts.length !== 3 || parts.some((p) => isNaN(p))) return null;
  const [d, m, y] = parts;
  const dt = new Date(y, m - 1, d);
  dt.setHours(0, 0, 0, 0);
  return dt;
}

function formatDisplayDate(dt) {
  const d = String(dt.getDate()).padStart(2, "0");
  const m = String(dt.getMonth() + 1).padStart(2, "0");
  const y = dt.getFullYear();
  return `${d}/${m}/${y}`;
}

function getTodayMidnight() {
  const t = new Date();
  t.setHours(0, 0, 0, 0);
  return t;
}

function getCylinderThresholdParts() {
  const months = Math.floor(CYLINDER_THRESHOLD_VALUE);
  const days = Math.round((CYLINDER_THRESHOLD_VALUE - months) * 100);
  return { months, days };
}

function getHeaderText() {
  const today = getTodayMidnight();
  const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  return `Today - ${formatDisplayDate(today)} (${dayNames[today.getDay()]})`;
}

function buildEventDisplay(rawName, rawDate, rawType) {
  const eventDate = parseEventDateString(rawDate);
  if (!eventDate) return null;
  const today = getTodayMidnight();
  const name = rawName || "";
  const displayDate = formatDisplayDate(eventDate);
  const type = (rawType || "countdown").toLowerCase();

  if (type === "elapsed") {
    const elapsedDays = Math.max(0, Math.round((today - eventDate) / 86400000));
    const months = Math.floor(elapsedDays / 30);
    const days = elapsedDays % 30;
    const countdown = months === 0 ? `${days} . Days` : `${months} . Months - ${days} . Days`;
    const { months: thMonths, days: thDays } = getCylinderThresholdParts();
    let isAlert = false;
    if (months > thMonths) isAlert = true;
    else if (months === thMonths) isAlert = days >= thDays;
    return { name, date: displayDate, countdown, isAlert };
  }

  const diffDays = Math.round((eventDate - today) / 86400000);
  if (diffDays < 0) {
    return { name, date: displayDate, countdown: "Expired", isAlert: true };
  }
  const countdown = `${diffDays} . Day Left`;
  const isAlert = diffDays <= ALERT_THRESHOLD_DAYS;
  return { name, date: displayDate, countdown, isAlert };
}

function applyStaggeredAnimation(el, value, delaySeconds, speedValue) {
  if (!el || !value || value === "none") return;
  const base = ANIM_BASE_DURATION[value] || 2;
  const dur = base * getSpeedMultiplier(speedValue);
  el.style.setProperty("--anim-dur", dur.toFixed(2) + "s");
  el.classList.add("anim-" + value);
  if (delaySeconds) el.style.animationDelay = delaySeconds + "s";
}

function renderEvents(container, events, page) {
  container.innerHTML = "";
  const settings = getSavedFontSettings(page);
  const anims = settings.animations || DEFAULT_PAGE_SETTINGS.animations;
  const stagger = anims.stagger === "sequence";
  const speed = anims.speed || "medium";
  events.forEach((e, idx) => {
    const item = document.createElement("div");
    item.className = "event";
    const isGasCylinder = e.name.trim().toLowerCase() === "gas cylinder";

    if (isGasCylinder) {
      item.innerHTML = `
        <div class="gas-row">
          <div class="gas-left">
            <div class="event-name">${e.name}</div>
            <div class="event-countdown">${e.countdown}</div>
            <div class="event-date">${e.date}</div>
          </div>
          <div class="cylinder-wrap-side">
            <div class="cylinder">
              <div class="cyl-top-collar"></div>
              <div class="cyl-support-pillars"><div class="cyl-pillar-center"></div></div>
              <div class="cyl-valve-tag"></div>
              <div class="cyl-dome"></div>
              <div class="cyl-dome-text">14.2 kg</div>
              <div class="cyl-body"></div>
              <div class="cyl-weld-line"></div>
              <div class="indian-gas-container"><div class="indian-text">INDIAN</div></div>
              <div class="cyl-foot">
                <div class="cyl-foot-hole"></div><div class="cyl-foot-hole"></div><div class="cyl-foot-hole"></div>
              </div>
            </div>
          </div>
        </div>
      `;
    } else {
      item.innerHTML = `<div class="event-name">${e.name}</div><div class="event-countdown">${e.countdown}</div><div class="event-date">${e.date}</div>`;
    }
    container.appendChild(item);

    const delay = stagger ? idx * 0.12 : 0;
    applyStaggeredAnimation(item.querySelector(".event-name"), anims.itemName, delay, speed);
    applyStaggeredAnimation(item.querySelector(".event-countdown"), anims.itemCountdown, delay, speed);
    applyStaggeredAnimation(item.querySelector(".event-date"), anims.itemDate, delay, speed);
    if (isGasCylinder) {
      applyStaggeredAnimation(item.querySelector(".cylinder-wrap-side"), anims.cylinder, delay, speed);
    }
  });
}

let latestRawEvents = [];

function renderAll() {
  const listAlerts = document.getElementById("list-alerts");
  const listData = document.getElementById("list-data");
  const headerText = getHeaderText();

  document.getElementById("header-alerts-left").textContent = headerText;
  document.getElementById("header-data-left").textContent = headerText;

  const events = latestRawEvents
    .map((ev) => buildEventDisplay(ev.name, ev.date, ev.type))
    .filter(Boolean);

  document.getElementById("header-data-right").textContent = events.length + ".Reminder List";

  if (events.length === 0) {
    listData.innerHTML = '<div class="empty-state">No events yet.</div>';
  } else {
    renderEvents(listData, events, "data");
  }

  const alerts = events.filter((e) => e.isAlert);
  if (alerts.length === 0) listAlerts.innerHTML = '<div class="empty-state">No alerts right now.</div>';
  else renderEvents(listAlerts, alerts, "alerts");
}

function loadAll() {
  renderAll();
}

if (eventsRef) {
  eventsRef.on("value", (snapshot) => {
    const val = snapshot.val();
    const raw = [];
    if (val) {
      Object.keys(val).forEach((key) => {
        const ev = val[key];
        if (!ev || !ev.name || !ev.date) return;
        raw.push({ name: ev.name, date: ev.date, type: ev.type });
      });
    }
    latestRawEvents = raw;
    renderAll();
  }, (error) => {
    const msg = '<div class="empty-state">Could not load data. Please try again later.</div>';
    document.getElementById("list-alerts").innerHTML = msg;
    document.getElementById("list-data").innerHTML = msg;
  });
} else {
  const msg = '<div class="empty-state">Could not load data. Please try again later.</div>';
  document.getElementById("list-alerts").innerHTML = msg;
  document.getElementById("list-data").innerHTML = msg;
}

const FONT_TARGETS = ["header", "name", "countdown", "date"];
const DEFAULT_PAGE_SETTINGS = {
  header: { size: 19, color: "#000000", font: "inherit", bold: false },
  name: { size: 20, color: "#000000", font: "inherit", bold: false },
  countdown: { size: 26, color: "#ff0000", font: "inherit", bold: true },
  date: { size: 15, color: "#000000", font: "inherit", bold: false },
  background: "#ffffff",
  animations: {
    title: "none",
    header: "none",
    reminder: "none",
    divider: "none",
    itemName: "none",
    itemCountdown: "none",
    itemDate: "none",
    cylinder: "none",
    speed: "medium",
    stagger: "together"
  }
};

const ANIMATION_OPTIONS = [
  { value: "none", label: "None" },
  { value: "pulse", label: "Pulse" },
  { value: "glow", label: "Glow" },
  { value: "float", label: "Float" },
  { value: "wobble", label: "Wobble" },
  { value: "heartbeat", label: "Heartbeat" },
  { value: "flicker", label: "Neon Flicker" },
  { value: "rainbow", label: "Rainbow Shift" },
  { value: "swing", label: "Swing" },
  { value: "shake", label: "Shake" },
  { value: "shimmer", label: "Shimmer" }
];
const ANIM_BASE_DURATION = {
  pulse: 1.8, glow: 2.0, float: 2.4, wobble: 2.0, heartbeat: 1.2,
  flicker: 2.6, rainbow: 3.0, swing: 2.2, shake: 0.6, shimmer: 2.5
};
const SPEED_OPTIONS = [
  { value: "slow", label: "Slow", mult: 1.8 },
  { value: "normal", label: "Normal", mult: 1.3 },
  { value: "medium", label: "Medium", mult: 1.0 },
  { value: "high", label: "High", mult: 0.55 }
];
const STAGGER_OPTIONS = [
  { value: "together", label: "Sab ek saath" },
  { value: "sequence", label: "Ek ke baad ek" }
];
const ANIM_FIELD_IDS = {
  title: "anim-title",
  header: "anim-header",
  reminder: "anim-reminder",
  divider: "anim-divider",
  itemName: "anim-item-name",
  itemCountdown: "anim-item-countdown",
  itemDate: "anim-item-date",
  cylinder: "anim-cylinder"
};

function populateAnimationSelects() {
  Object.values(ANIM_FIELD_IDS).forEach((id) => {
    const sel = document.getElementById(id);
    sel.innerHTML = "";
    ANIMATION_OPTIONS.forEach((opt) => {
      const o = document.createElement("option");
      o.value = opt.value;
      o.textContent = opt.label;
      sel.appendChild(o);
    });
  });
  const staggerSel = document.getElementById("anim-stagger");
  staggerSel.innerHTML = "";
  STAGGER_OPTIONS.forEach((opt) => {
    const o = document.createElement("option");
    o.value = opt.value;
    o.textContent = opt.label;
    staggerSel.appendChild(o);
  });
  const speedSel = document.getElementById("anim-speed");
  speedSel.innerHTML = "";
  SPEED_OPTIONS.forEach((opt) => {
    const o = document.createElement("option");
    o.value = opt.value;
    o.textContent = opt.label;
    speedSel.appendChild(o);
  });
}
populateAnimationSelects();

function cloneDefaults() { return JSON.parse(JSON.stringify(DEFAULT_PAGE_SETTINGS)); }
let cloudSettings = { alerts: cloneDefaults(), data: cloneDefaults() };
function getSavedFontSettings(page) { return cloudSettings[page] || cloneDefaults(); }

const savedPage = sessionStorage.getItem("activePage");
showPage(savedPage === "data" ? "data" : "alerts");
renderAll();
setInterval(renderAll, 60000);

function applyFontSettingsToContainer(containerId, settings) {
  const container = document.getElementById(containerId);
  FONT_TARGETS.forEach((target) => {
    const s = settings[target] || DEFAULT_PAGE_SETTINGS[target];
    container.style.setProperty(`--${target}-size`, s.size + "px");
    container.style.setProperty(`--${target}-color`, s.color);
    container.style.setProperty(`--${target}-font`, s.font);
    container.style.setProperty(`--${target}-weight`, s.bold ? "700" : "400");
  });
}

function applyPageBackground(page) {
  const settings = getSavedFontSettings(page);
  document.body.style.backgroundColor = settings.background || "#ffffff";
}

function getSpeedMultiplier(speedValue) {
  const found = SPEED_OPTIONS.find((s) => s.value === speedValue);
  return found ? found.mult : 1.0;
}

function applyElementAnimation(el, value, speedValue) {
  if (!el) return;
  ANIMATION_OPTIONS.forEach((opt) => {
    if (opt.value !== "none") el.classList.remove("anim-" + opt.value);
  });
  el.style.animationDelay = "";
  el.style.removeProperty("--anim-dur");
  if (value && value !== "none") {
    const base = ANIM_BASE_DURATION[value] || 2;
    const dur = base * getSpeedMultiplier(speedValue);
    el.style.setProperty("--anim-dur", dur.toFixed(2) + "s");
    el.classList.add("anim-" + value);
  }
}

function applyPageAnimation(page) {
  const settings = getSavedFontSettings(page);
  const anims = settings.animations || DEFAULT_PAGE_SETTINGS.animations;
  const speed = anims.speed || "medium";
  if (page === "alerts") {
    applyElementAnimation(document.getElementById("alerts-title"), anims.title, speed);
    applyElementAnimation(document.getElementById("header-alerts-left"), anims.header, speed);
    applyElementAnimation(document.getElementById("header-alerts-right"), anims.reminder, speed);
    applyElementAnimation(document.getElementById("divider-alerts"), anims.divider, speed);
  } else {
    applyElementAnimation(document.getElementById("header-data-left"), anims.header, speed);
    applyElementAnimation(document.getElementById("header-data-right"), anims.reminder, speed);
    applyElementAnimation(document.getElementById("divider-data"), anims.divider, speed);
  }
}

function fillSettingsForm(settings) {
  FONT_TARGETS.forEach((target) => {
    const s = settings[target] || DEFAULT_PAGE_SETTINGS[target];
    document.getElementById(`${target}-size`).value = s.size;
    document.getElementById(`${target}-color`).value = s.color;
    document.getElementById(`${target}-font`).value = s.font;
    document.getElementById(`${target}-bold`).checked = !!s.bold;
  });
  document.getElementById("page-bg-color").value = settings.background || "#ffffff";
  const anims = settings.animations || DEFAULT_PAGE_SETTINGS.animations;
  Object.keys(ANIM_FIELD_IDS).forEach((key) => {
    document.getElementById(ANIM_FIELD_IDS[key]).value = anims[key] || "none";
  });
  document.getElementById("anim-speed").value = anims.speed || "medium";
  document.getElementById("anim-stagger").value = anims.stagger || "together";
}

function readSettingsForm() {
  const settings = {};
  FONT_TARGETS.forEach((target) => {
    settings[target] = {
      size: parseInt(document.getElementById(`${target}-size`).value, 10) || DEFAULT_PAGE_SETTINGS[target].size,
      color: document.getElementById(`${target}-color`).value,
      font: document.getElementById(`${target}-font`).value,
      bold: document.getElementById(`${target}-bold`).checked
    };
  });
  settings.background = document.getElementById("page-bg-color").value;
  const anims = {};
  Object.keys(ANIM_FIELD_IDS).forEach((key) => {
    anims[key] = document.getElementById(ANIM_FIELD_IDS[key]).value;
  });
  anims.speed = document.getElementById("anim-speed").value;
  anims.stagger = document.getElementById("anim-stagger").value;
  settings.animations = anims;
  return settings;
}

let configDrafts = null;
let currentConfigTab = "alerts";

function updateTabUI() {
  document.getElementById("cfgtab-alerts").classList.toggle("active", currentConfigTab === "alerts");
  document.getElementById("cfgtab-data").classList.toggle("active", currentConfigTab === "data");
}

function switchConfigTab(tab) {
  configDrafts[currentConfigTab] = readSettingsForm();
  currentConfigTab = tab;
  updateTabUI();
  fillSettingsForm(configDrafts[currentConfigTab]);
}

function openSettings() {
  configDrafts = {
    alerts: JSON.parse(JSON.stringify(getSavedFontSettings("alerts"))),
    data: JSON.parse(JSON.stringify(getSavedFontSettings("data")))
  };
  currentConfigTab = getActivePageName();
  updateTabUI();
  fillSettingsForm(configDrafts[currentConfigTab]);
  document.getElementById("threshold-days").value = ALERT_THRESHOLD_DAYS;
  document.getElementById("threshold-cylinder").value = CYLINDER_THRESHOLD_VALUE.toFixed(2);
  document.getElementById("settingsOverlay").classList.add("open");
}

function closeSettings() {
  document.getElementById("settingsOverlay").classList.remove("open");
}

async function applySettings() {
  configDrafts[currentConfigTab] = readSettingsForm();
  cloudSettings.alerts = configDrafts.alerts;
  cloudSettings.data = configDrafts.data;
  const daysVal = parseInt(document.getElementById("threshold-days").value, 10);
  const cylVal = parseFloat(document.getElementById("threshold-cylinder").value);
  cloudSettings.thresholds = {
    days: isNaN(daysVal) ? ALERT_THRESHOLD_DAYS : daysVal,
    cylinder: isNaN(cylVal) ? CYLINDER_THRESHOLD_VALUE : cylVal
  };
  ALERT_THRESHOLD_DAYS = cloudSettings.thresholds.days;
  CYLINDER_THRESHOLD_VALUE = cloudSettings.thresholds.cylinder;
  applyFontSettingsToContainer("page-alerts", cloudSettings.alerts);
  applyFontSettingsToContainer("page-data", cloudSettings.data);
  applyPageBackground(getActivePageName());
  applyPageAnimation(getActivePageName());
  loadAll();
  setSyncStatus("Saving...");
  try {
    await saveCloudSettings(cloudSettings);
    setSyncStatus("Synced");
  } catch (err) {
    setSyncStatus("Sync failed");
  }
  closeSettings();
}

function resetSettings() {
  const defaults = cloneDefaults();
  configDrafts[currentConfigTab] = defaults;
  fillSettingsForm(defaults);
}

if (settingsRef) {
  settingsRef.on("value", (snapshot) => {
    const val = snapshot.val();
    if (val) {
      if (val.alerts) cloudSettings.alerts = val.alerts;
      if (val.data) cloudSettings.data = val.data;
      if (val.thresholds) {
        cloudSettings.thresholds = val.thresholds;
        ALERT_THRESHOLD_DAYS = val.thresholds.days || ALERT_THRESHOLD_DAYS;
        CYLINDER_THRESHOLD_VALUE = (val.thresholds.cylinder !== undefined) ? val.thresholds.cylinder : CYLINDER_THRESHOLD_VALUE;
      }
      applyFontSettingsToContainer("page-alerts", cloudSettings.alerts);
      applyFontSettingsToContainer("page-data", cloudSettings.data);
      applyPageBackground(getActivePageName());
      applyPageAnimation(getActivePageName());
      loadAll();
      setSyncStatus("Synced");
    } else {
      setSyncStatus("");
    }
  }, (error) => {
    setSyncStatus("Sync error");
  });
} else {
  setSyncStatus("Offline");
}

// Auto-update checker: detects new deployment and reloads automatically, no manual refresh needed
(function(){
  let baselineHTML = null;
  async function checkForUpdate(){
    try{
      const res = await fetch(location.pathname + "?_=" + Date.now(), { cache: "no-store" });
      const text = await res.text();
      if(baselineHTML === null){
        baselineHTML = text;
        return;
      }
      if(text !== baselineHTML){
        location.reload();
      }
    }catch(e){}
  }
  checkForUpdate();
  setInterval(checkForUpdate, 3000);
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden){
      checkForUpdate();
    }
  });
  window.addEventListener("focus", checkForUpdate);
})();
