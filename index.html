<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reminders</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: #ffffff;
    color: #000000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    padding: 70px 20px 80px;
    max-width: 640px;
    margin: 0 auto;
  }

  .header-date {
    font-size: var(--header-size, 19px);
    color: var(--header-color, #000000);
    font-family: var(--header-font, inherit);
    font-weight: var(--header-weight, 400);
    margin-bottom: 28px;
  }

  .event {
    margin-bottom: 22px;
  }

  .event-name {
    color: var(--name-color, #000000);
    font-size: var(--name-size, 20px);
    font-family: var(--name-font, inherit);
    font-weight: var(--name-weight, 400);
    margin-bottom: 4px;
  }

  .event-countdown {
    color: var(--countdown-color, #ff0000);
    font-size: var(--countdown-size, 26px);
    font-family: var(--countdown-font, inherit);
    font-weight: var(--countdown-weight, 700);
    margin-bottom: 2px;
  }

  .event-date {
    color: var(--date-color, #000000);
    font-size: var(--date-size, 15px);
    font-family: var(--date-font, inherit);
    font-weight: var(--date-weight, 400);
  }

  #page-alerts .header-date {
    text-align: center;
  }

  #list-alerts {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #list-alerts .event {
    text-align: left;
  }

  .empty-state {
    color: #555;
    font-size: 16px;
    margin-top: 12px;
  }

  .loading {
    color: #555;
  }

  .page {
    display: none;
  }

  .page.active {
    display: block;
  }

  .page-toggle-btn {
    position: fixed;
    top: 18px;
    right: 16px;
    background: transparent;
    color: #b3b3b3;
    border: none;
    padding: 6px 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    z-index: 15;
  }

  .settings-icon {
    position: fixed;
    bottom: 16px;
    right: 16px;
    width: 38px;
    height: 38px;
    background: transparent;
    color: #57534e;
    border: none;
    font-size: 22px;
    cursor: pointer;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .settings-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 30;
    align-items: flex-end;
    justify-content: center;
  }

  .settings-overlay.open {
    display: flex;
  }

  .settings-panel {
    background: #ffffff;
    width: 100%;
    max-width: 640px;
    max-height: 85vh;
    overflow-y: auto;
    border-radius: 16px 16px 0 0;
    padding: 20px;
  }

  .settings-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
  }

  .settings-title button {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: #000000;
  }

  .settings-page-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .cfgtab {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ddd;
    background: #f5f5f5;
    color: #000;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .cfgtab.active {
    background: #d40000;
    color: #ffffff;
    border-color: #d40000;
  }

  .settings-row {
    border-top: 1px solid #eee;
    padding: 14px 0;
  }

  .settings-row-label {
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 10px;
  }

  .settings-controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  .settings-controls label {
    font-size: 12px;
    color: #555;
    display: block;
    margin-bottom: 2px;
  }

  .settings-field {
    display: flex;
    flex-direction: column;
  }

  .settings-field input[type="number"] {
    width: 64px;
    padding: 6px;
    border: 1px solid #ccc;
    border-radius: 6px;
  }

  .settings-field select {
    padding: 6px;
    border: 1px solid #ccc;
    border-radius: 6px;
    max-width: 140px;
  }

  .color-combo {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .color-combo input[type="color"] {
    width: 34px;
    height: 34px;
    padding: 0;
    border: 1px solid #ccc;
    border-radius: 6px;
  }

  .settings-field-bold {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .settings-field-bold input[type="checkbox"] {
    width: 20px;
    height: 20px;
    margin-top: 4px;
  }

  .settings-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }

  .settings-actions button {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-weight: 700;
    cursor: pointer;
  }

  .settings-apply {
    background: #d40000;
    color: #ffffff;
  }

  .settings-reset {
    background: #eee;
    color: #000000;
  }
</style>
</head>
<body>

<button id="pageToggleBtn" class="page-toggle-btn" onclick="togglePage()">List</button>
<button class="settings-icon" onclick="openSettings()" title="Settings">⚙</button>

<div id="settingsOverlay" class="settings-overlay">
  <div class="settings-panel">
    <div class="settings-title">
      <span>Settings</span>
      <button onclick="closeSettings()">✕</button>
    </div>

    <div class="settings-page-tabs">
      <button id="cfgtab-alerts" class="cfgtab active" onclick="switchConfigTab('alerts')">Alerts Page</button>
      <button id="cfgtab-data" class="cfgtab" onclick="switchConfigTab('data')">List Page</button>
    </div>

    <div class="settings-row">
      <div class="settings-row-label">Page Background</div>
      <div class="settings-controls">
        <div class="settings-field">
          <label>Color</label>
          <div class="color-combo">
            <input type="color" id="page-bg-color">
          </div>
        </div>
      </div>
    </div>

    <div class="settings-row">
      <div class="settings-row-label">Date Header (Today - ...)</div>
      <div class="settings-controls">
        <div class="settings-field">
          <label>Size</label>
          <input type="number" id="header-size" min="8" max="60">
        </div>
        <div class="settings-field">
          <label>Color</label>
          <div class="color-combo">
            <input type="color" id="header-color">
          </div>
        </div>
        <div class="settings-field">
          <label>Style</label>
          <select id="header-font"></select>
        </div>
        <div class="settings-field-bold">
          <label>Bold</label>
          <input type="checkbox" id="header-bold">
        </div>
      </div>
    </div>

    <div class="settings-row">
      <div class="settings-row-label">Name (e.g. V! Recharge)</div>
      <div class="settings-controls">
        <div class="settings-field">
          <label>Size</label>
          <input type="number" id="name-size" min="8" max="60">
        </div>
        <div class="settings-field">
          <label>Color</label>
          <div class="color-combo">
            <input type="color" id="name-color">
          </div>
        </div>
        <div class="settings-field">
          <label>Style</label>
          <select id="name-font"></select>
        </div>
        <div class="settings-field-bold">
          <label>Bold</label>
          <input type="checkbox" id="name-bold">
        </div>
      </div>
       </div>
     <div class="settings-row">
      <div class="settings-row-label">Countdown (e.g. In 2 days)</div>
      <div class="settings-controls">
        <div class="settings-field">
          <label>Size</label>
          <input type="number" id="countdown-size" min="8" max="60">
        </div>
        <div class="settings-field">
          <label>Color</label>
          <div class="color-combo">
            <input type="color" id="countdown-color">
          </div>
        </div>
        <div class="settings-field">
          <label>Style</label>
          <select id="countdown-font"></select>
        </div>
        <div class="settings-field-bold">
          <label>Bold</label>
          <input type="checkbox" id="countdown-bold">
        </div>
      </div>
    </div>

    <div class="settings-row">
      <div class="settings-row-label">Target Date (e.g. 29 Mar 2026)</div>
      <div class="settings-controls">
        <div class="settings-field">
          <label>Size</label>
          <input type="number" id="date-size" min="8" max="60">
        </div>
        <div class="settings-field">
          <label>Color</label>
          <div class="color-combo">
            <input type="color" id="date-color">
          </div>
        </div>
        <div class="settings-field">
          <label>Style</label>
          <select id="date-font"></select>
        </div>
        <div class="settings-field-bold">
          <label>Bold</label>
          <input type="checkbox" id="date-bold">
        </div>
      </div>
    </div>

    <div class="settings-actions">
      <button class="settings-apply" onclick="saveCurrentConfig()">Apply</button>
      <button class="settings-reset" onclick="resetCurrentConfig()">Reset Defaults</button>
    </div>
  </div>
</div>

<div id="page-alerts" class="page active">
  <div id="header-alerts" class="header-date">Loading...</div>
  <div id="list-alerts"></div>
</div>

<div id="page-data" class="page">
  <div id="header-data" class="header-date">Loading...</div>
  <div id="list-data"></div>
</div>

<script>
  const fonts = [
    { label: "Default", value: "inherit" },
    { label: "Sans-Serif", value: "sans-serif" },
    { label: "Serif", value: "serif" },
    { label: "Monospace", value: "monospace" },
    { label: "Arial", value: "Arial, sans-serif" },
    { label: "Georgia", value: "Georgia, serif" },
    { label: "Courier New", value: "'Courier New', monospace" }
  ];

  const defaultConfigAlerts = {
    bgColor: "#ffffff",
    headerSize: 19, headerColor: "#000000", headerFont: "inherit", headerBold: false,
    nameSize: 20, nameColor: "#000000", nameFont: "inherit", nameBold: false,
    countdownSize: 26, countdownColor: "#ff0000", countdownFont: "inherit", countdownBold: true,
    dateSize: 15, dateColor: "#000000", dateFont: "inherit", dateBold: false
  };

  const defaultConfigData = {
    bgColor: "#ffffff",
    headerSize: 19, headerColor: "#000000", headerFont: "inherit", headerBold: false,
    nameSize: 20, nameColor: "#000000", nameFont: "inherit", nameBold: false,
    countdownSize: 26, countdownColor: "#ff0000", countdownFont: "inherit", countdownBold: true,
    dateSize: 15, dateColor: "#000000", dateFont: "inherit", dateBold: false
  };

  let activeConfigTab = 'alerts';
  let currentPage = 'alerts';

  function populateFontDropdowns() {
    ['header-font', 'name-font', 'countdown-font', 'date-font'].forEach(id => {
      const select = document.getElementById(id);
      if (!select) return;
      select.innerHTML = '';
      fonts.forEach(f => {
        const opt = document.createElement('option');
        opt.value = f.value;
        opt.textContent = f.label;
        select.appendChild(opt);
      });
    });
  }

  function togglePage() {
    const alertsPage = document.getElementById('page-alerts');
    const dataPage = document.getElementById('page-data');
    const btn = document.getElementById('pageToggleBtn');

    if (currentPage === 'alerts') {
      alertsPage.classList.remove('active');
      dataPage.classList.add('active');
      btn.textContent = 'Alerts';
      currentPage = 'data';
    } else {
      dataPage.classList.remove('active');
      alertsPage.classList.add('active');
      btn.textContent = 'List';
      currentPage = 'alerts';
    }
  }

  function openSettings() {
    document.getElementById('settingsOverlay').classList.add('open');
    loadConfigToForm(activeConfigTab);
  }

  function closeSettings() {
    document.getElementById('settingsOverlay').classList.remove('open');
  }

  function switchConfigTab(tab) {
    activeConfigTab = tab;
    document.getElementById('cfgtab-alerts').classList.toggle('active', tab === 'alerts');
    document.getElementById('cfgtab-data').classList.toggle('active', tab === 'data');
    loadConfigToForm(tab);
  }

  function loadConfigToForm(tab) {
    const configKey = tab === 'alerts' ? 'configAlerts' : 'configData';
    const defaultConfig = tab === 'alerts' ? defaultConfigAlerts : defaultConfigData;
    const cfg = JSON.parse(localStorage.getItem(configKey)) || defaultConfig;

    document.getElementById('page-bg-color').value = cfg.bgColor;
    document.getElementById('header-size').value = cfg.headerSize;
    document.getElementById('header-color').value = cfg.headerColor;
    document.getElementById('header-font').value = cfg.headerFont;
    document.getElementById('header-bold').checked = cfg.headerBold;

    document.getElementById('name-size').value = cfg.nameSize;
    document.getElementById('name-color').value = cfg.nameColor;
    document.getElementById('name-font').value = cfg.nameFont;
    document.getElementById('name-bold').checked = cfg.nameBold;

    document.getElementById('countdown-size').value = cfg.countdownSize;
    document.getElementById('countdown-color').value = cfg.countdownColor;
    document.getElementById('countdown-font').value = cfg.countdownFont;
    document.getElementById('countdown-bold').checked = cfg.countdownBold;

    document.getElementById('date-size').value = cfg.dateSize;
    document.getElementById('date-color').value = cfg.dateColor;
    document.getElementById('date-font').value = cfg.dateFont;
    document.getElementById('date-bold').checked = cfg.dateBold;
  }

  function saveCurrentConfig() {
    const cfg = {
      bgColor: document.getElementById('page-bg-color').value,
      headerSize: document.getElementById('header-size').value,
      headerColor: document.getElementById('header-color').value,
      headerFont: document.getElementById('header-font').value,
      headerBold: document.getElementById('header-bold').checked,
      nameSize: document.getElementById('name-size').value,
      nameColor: document.getElementById('name-color').value,
      nameFont: document.getElementById('name-font').value,
      nameBold: document.getElementById('name-bold').checked,
      countdownSize: document.getElementById('countdown-size').value,
      countdownColor: document.getElementById('countdown-color').value,
      countdownFont: document.getElementById('countdown-font').value,
      countdownBold: document.getElementById('countdown-bold').checked,
      dateSize: document.getElementById('date-size').value,
      dateColor: document.getElementById('date-color').value,
      dateFont: document.getElementById('date-font').value,
      dateBold: document.getElementById('date-bold').checked
    };

    const configKey = activeConfigTab === 'alerts' ? 'configAlerts' : 'configData';
    localStorage.setItem(configKey, JSON.stringify(cfg));
    applyStyles();
    closeSettings();
  }

  function resetCurrentConfig() {
    const configKey = activeConfigTab === 'alerts' ? 'configAlerts' : 'configData';
    const defaultConfig = activeConfigTab === 'alerts' ? defaultConfigAlerts : defaultConfigData;
    localStorage.setItem(configKey, JSON.stringify(defaultConfig));
    loadConfigToForm(activeConfigTab);
    applyStyles();
  }

  function applyStyles() {
    const configKey = currentPage === 'alerts' ? 'configAlerts' : 'configData';
    const defaultConfig = currentPage === 'alerts' ? defaultConfigAlerts : defaultConfigData;
    const cfg = JSON.parse(localStorage.getItem(configKey)) || defaultConfig;

    const root = document.documentElement;
    root.style.setProperty('--header-size', cfg.headerSize + 'px');
    root.style.setProperty('--header-color', cfg.headerColor);
    root.style.setProperty('--header-font', cfg.headerFont);
    root.style.setProperty('--header-weight', cfg.headerBold ? '700' : '400');

    root.style.setProperty('--name-size', cfg.nameSize + 'px');
    root.style.setProperty('--name-color', cfg.nameColor);
    root.style.setProperty('--name-font', cfg.nameFont);
    root.style.setProperty('--name-weight', cfg.nameBold ? '700' : '400');

    root.style.setProperty('--countdown-size', cfg.countdownSize + 'px');
    root.style.setProperty('--countdown-color', cfg.countdownColor);
    root.style.setProperty('--countdown-font', cfg.countdownFont);
    root.style.setProperty('--countdown-weight', cfg.countdownBold ? '700' : '400');

    root.style.setProperty('--date-size', cfg.dateSize + 'px');
    root.style.setProperty('--date-color', cfg.dateColor);
    root.style.setProperty('--date-font', cfg.dateFont);
    root.style.setProperty('--date-weight', cfg.dateBold ? '700' : '400');

    document.body.style.backgroundColor = cfg.bgColor;
  }

  function loadPageData() {
    const today = new Date();
    const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
    const dateString = "Today - " + today.toLocaleDateString('en-US', options);

    document.getElementById('header-alerts').textContent = dateString;
    document.getElementById('header-data').textContent = dateString;

    document.getElementById('list-alerts').innerHTML = `
      <div class="event">
        <div class="event-name">V! Recharge</div>
        <div class="event-countdown">In 2 days</div>
        <div class="event-date">29 Jul 2026</div>
      </div>
    `;

    document.getElementById('list-data').innerHTML = `
      <div class="event">
        <div class="event-name">V! Recharge</div>
        <div class="event-countdown">In 2 days</div>
        <div class="event-date">29 Jul 2026</div>
      </div>
    `;
  }

  document.addEventListener('DOMContentLoaded', () => {
    populateFontDropdowns();
    applyStyles();
    loadPageData();
  });
</script>
</body>
 </html>
