<style>

  #header-alerts-left, #header-data-left, #header-data-right, #alertTitleText, .anim-pick-preview { display: inline-block; }

  .la-6 { animation: k6 3s ease-in-out infinite; animation-duration: calc(3s / var(--la-speed, 1)); }

  .la-21 { position: relative; }

  .la-25 { animation: k25 2.6s ease-in-out infinite; animation-duration: calc(2.6s / var(--la-speed, 1)); }

  /* 27-34: Kinetic typography */
  .la-27 { display:inline-block; overflow:hidden; white-space:nowrap; border-right:2px solid #d40000; animation: k27w 3s steps(14,end) infinite, k27c 0.7s step-end infinite; max-width: 100%; animation-duration: calc(3s / var(--la-speed, 1)), calc(0.7s / var(--la-speed, 1)); }

  .la-31 { background-image: linear-gradient(90deg,#000 50%,#bbb 50%); background-size:200% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; animation: k31 2.4s steps(20,end) infinite; animation-duration: calc(2.4s / var(--la-speed, 1)); }

function saveCloudSettings(data) {
  if (!settingsRef) return Promise.reject(new Error("Firebase not available"));
  // Firebase's client SDK throws synchronously if ANY nested property anywhere
  // in the object is undefined (not null — undefined specifically), which
  // would abort the whole save regardless of connection quality. Round-tripping
  // through JSON strips every undefined value automatically, so a save can
  // never fail for this reason again.
  let clean;
  try {
    clean = JSON.parse(JSON.stringify(data));
  } catch (e) {
    return Promise.reject(e);
  }
  // update() instead of set(): set() replaces the ENTIRE /settings node, so if
  // cloudSettings in memory hadn't yet received e.g. the saved alertTitle label
  // from the server (still loading) at the moment some other setting was saved,
  // set() would silently erase it from Firebase for good -- which looked like
  // "it never comes back after a refresh". update() only touches the keys
  // actually present in `clean`, leaving everything else on the server untouched.
  return settingsRef.update(clean);
}

function parseEventDateString(dateStr) {
  const parts = String(dateStr).trim().split(/[-.\/]/).map((p) => parseInt(p, 10));
  if (parts.length !== 3 || parts.some((p) => isNaN(p))) return null;
  const [d, m, y] = parts;
  const dt = new Date(y, m - 1, d);
  dt.setHours(0, 0, 0, 0);
  return dt;
}

function formatDisplayDate(dt) {
  const d = String(dt.getDate()).padStart(2, "0");
  const m = String(dt.getMonth() + 1).padStart(2, "0");
  const y = dt.getFullYear();
  return `${d}/${m}/${y}`;
}

function getTodayMidnight() {
  const t = new Date();
  t.setHours(0, 0, 0, 0);
  return t;
}

function getCylinderThresholdParts() {
  const months = Math.floor(CYLINDER_THRESHOLD_VALUE);
  const days = Math.round((CYLINDER_THRESHOLD_VALUE - months) * 100);
  return { months, days };
}

function getHeaderText() {
  const today = getTodayMidnight();
  const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  return `Today - ${formatDisplayDate(today)} (${dayNames[today.getDay()]})`;
}

// Normalizes an item's animation data to an array of animation ids, up to 3.
// Supports both the new "animations" array field and the old single "animation" field
// (from before multi-animation support was added) so nothing already saved breaks.
function normalizeAnimationIds(animationsField, legacyAnimationField) {
  let ids = [];
  if (Array.isArray(animationsField)) ids = animationsField.slice();
  else if (legacyAnimationField) ids = [legacyAnimationField];
  return ids.filter((id) => id && id !== "none").slice(0, 3);
}

function buildEventDisplay(rawName, rawDate, rawType, rawAlertDays, rawKey, rawAnimation, rawAnimations) {
  const eventDate = parseEventDateString(rawDate);
  if (!eventDate) return null;
  const today = getTodayMidnight();
  const name = rawName || "";
  const displayDate = formatDisplayDate(eventDate);
  const type = (rawType || "countdown").toLowerCase();
  const alertDays = (rawAlertDays !== undefined && rawAlertDays !== null && !isNaN(rawAlertDays)) ? Number(rawAlertDays) : null;
  const animation = rawAnimation || null;
  const animations = normalizeAnimationIds(rawAnimations, rawAnimation);

  if (type === "elapsed") {
    const elapsedDays = Math.max(0, Math.round((today - eventDate) / 86400000));
    const months = Math.floor(elapsedDays / 30);
    const days = elapsedDays % 30;
    const countdown = months === 0 ? `${days} . Days` : `${months} . Months - ${days} . Days`;
    let isAlert = false;
    if (alertDays !== null) {
      isAlert = elapsedDays >= alertDays;
    } else {
      const { months: thMonths, days: thDays } = getCylinderThresholdParts();
      if (months > thMonths) isAlert = true;
      else if (months === thMonths) isAlert = days >= thDays;
    }
    return { name, date: displayDate, countdown, isAlert, key: rawKey, animation, animations };
  }

  const diffDays = Math.round((eventDate - today) / 86400000);
  if (diffDays < 0) {
    return { name, date: displayDate, countdown: "Expired", isAlert: true, key: rawKey, animation, animations };
  }
  const countdown = `${diffDays} . Day Left`;
  const isAlert = diffDays <= (alertDays !== null ? alertDays : ALERT_THRESHOLD_DAYS);
  return { name, date: displayDate, countdown, isAlert, key: rawKey, animation, animations };
}

let latestRawEvents = [];

function getSortedEvents() {
  return latestRawEvents
    .map((ev, idx) => ({ ...ev, order: (ev.order !== undefined && ev.order !== null) ? ev.order : idx }))
    .sort((a, b) => a.order - b.order);
}

function moveReminder(key, direction) {
  const sorted = getSortedEvents();
  const idx = sorted.findIndex((ev) => ev.key === key);
  if (idx === -1) return;
  const targetIdx = idx + direction;
  if (targetIdx < 0 || targetIdx >= sorted.length) return;
  const temp = sorted[idx];
  sorted[idx] = sorted[targetIdx];
  sorted[targetIdx] = temp;
  const updates = {};
  sorted.forEach((ev, i) => { updates[ev.key + "/order"] = i; });
  eventsRef.update(updates);
}

function applyLabelAnimClass(el, animIds) {
  if (!el) return;
  const ids = normalizeAnimationIds(animIds, null);
  const text = el.textContent;
  el.className = el.className.split(" ").filter((c) => !c.startsWith("la-")).join(" ");
  el.textContent = "";
  if (ids.length === 0) {
    el.textContent = text;
    return;
  }
  // Same nested-wrapper technique as events: each id gets its own element
  // and its own independent animation, so multiple animations combine cleanly.
  let mounted = document.createElement("span");
  mounted.textContent = text;
  ids.forEach((id) => {
    const wrap = document.createElement("span");
    wrap.className = "la-" + id;
    wrap.style.display = "inline-block";
    wrap.appendChild(mounted);
    mounted = wrap;
  });
  el.appendChild(mounted);
}

  // permanently frozen by a saved custom label (that was the real bug: if the
  // pencil/edit icon on the header was ever tapped and saved, it stored a fixed
  // text that silently overrode the live date forever, so the date looked "stuck").
  const headerLabelRaw = cloudSettings.labels && cloudSettings.labels.header;
  const headerLabel = (headerLabelRaw && headerLabelRaw.hidden) ? "" : headerText;

  document.getElementById("header-alerts-left").textContent = headerLabel;
  document.getElementById("header-data-left").textContent = headerLabel;
  applyLabelAnimClass(document.getElementById("header-alerts-left"), getLabelAnimations("header"));
  applyLabelAnimClass(document.getElementById("header-data-left"), getLabelAnimations("header"));

  const events = getSortedEvents()
    .map((ev) => buildEventDisplay(ev.name, ev.date, ev.type, ev.alertDays, ev.key, ev.animation, ev.animations))
    .filter(Boolean);

  document.getElementById("header-data-right").textContent = getLabelValue("listCount", events.length + ".Reminder List");
  applyLabelAnimClass(document.getElementById("header-data-right"), getLabelAnimations("listCount"));
  const alertTitleEl = document.getElementById("alertTitleText");
  if (alertTitleEl) {
    alertTitleEl.textContent = getLabelValue("alertTitle", "Alert");
    applyLabelAnimClass(alertTitleEl, getLabelAnimations("alertTitle"));
  }

  if (events.length === 0) {
    listData.innerHTML = '<div class="refreshing-state">Refreshing <span class="dots-bold">. . .</span></div>';
  } else {
    renderEvents(listData, events, true);
  }

  const alerts = events.filter((e) => e.isAlert);
  if (alerts.length === 0) listAlerts.innerHTML = '<div class="refreshing-state">Refreshing <span class="dots-bold">. . .</span></div>';
  else renderEvents(listAlerts, alerts, false);
}

function saveNewReminder() {
  const name = document.getElementById("new-list-name").value.trim();
  const dateVal = document.getElementById("new-target-date").value.trim();
  const alertDayRaw = document.getElementById("new-alert-day").value;
  const alertDay = parseInt(alertDayRaw, 10);
  const type = document.querySelector('input[name="new-type"]:checked').value;

  if (!name || !dateVal) {
    alert("Please fill in the List Name and Target Date.");
    return;
  }
  if (!parseEventDateString(dateVal)) {
    alert("Please enter the Target Date in the correct format: DD/MM/YYYY (e.g. 15/08/2026)");
    return;
  }
  if (!eventsRef) {
    alert("Firebase connect nahi hai, list save nahi ho payegi.");
    return;
  }

  const newEvent = {
    name: name,
    date: dateVal,
    type: type,
    alertDays: isNaN(alertDay) ? ALERT_THRESHOLD_DAYS : alertDay
  };

  let action;
  if (editingReminderKey) {
    action = eventsRef.child(editingReminderKey).update(newEvent);
  } else {
    newEvent.order = getSortedEvents().length;
    action = eventsRef.push(newEvent);
  }

  action
    .then(() => {
      editingReminderKey = null;
      closeAddReminder();
    })
    .catch((err) => {
      alert("Save nahi ho paya: " + err.message);
    });
}

cloudSettings.animSpeed = cloudSettings.animSpeed || "normal";
applyAnimSpeedToPage(cloudSettings.animSpeed);
cloudSettings.data = cloneDefaults();
function getSavedFontSettings(page) { return cloudSettings[page] || cloneDefaults(); }

const DEFAULT_LINE_STYLE = { color: "#e75480", thickness: 2, offset: 0 };
function getLineStyle() { return cloudSettings.headerLine || DEFAULT_LINE_STYLE; }

function applyLineStyleToPage() {
  const s = getLineStyle();
  document.documentElement.style.setProperty("--line-color", s.color);
  document.documentElement.style.setProperty("--line-thickness", s.thickness + "px");
  document.documentElement.style.setProperty("--line-offset", s.offset + "px");
}

function syncLineStyleUI() {
  applyLineStyleToPage();
  const s = getLineStyle();
  ["alerts", "data"].forEach((p) => {
    const colorInput = document.getElementById("lineColorInput-" + p);
    if (colorInput) colorInput.value = s.color;
    const colorDot = document.getElementById("lineColorDot-" + p);
    if (colorDot) colorDot.style.backgroundColor = s.color;
    const thicknessInput = document.getElementById("lineThicknessInput-" + p);
    if (thicknessInput && document.activeElement !== thicknessInput) thicknessInput.value = s.thickness;
  });
}

let lineStyleSaveTimer = null;
function saveLineStyle(partial) {
  cloudSettings.headerLine = Object.assign({}, getLineStyle(), partial);
  syncLineStyleUI();
  if (lineStyleSaveTimer) clearTimeout(lineStyleSaveTimer);
  lineStyleSaveTimer = setTimeout(() => saveCloudSettings(cloudSettings), 400);
}

function adjustLineOffset(delta) {
  const s = getLineStyle();
  saveLineStyle({ offset: (s.offset || 0) + delta });
}

function setLineThickness(val) {
  const n = Math.min(10, Math.max(1, parseInt(val, 10) || 1));
  saveLineStyle({ thickness: n });
}

function setLineColor(val) {
  saveLineStyle({ color: val });
}

let lineStyleHideTimer = null;

function clearLineStyleTimer() {
  if (lineStyleHideTimer) { clearTimeout(lineStyleHideTimer); lineStyleHideTimer = null; }
}

function scheduleLineStyleHide(wrapEl) {
  clearLineStyleTimer();
  lineStyleHideTimer = setTimeout(() => {
    wrapEl.classList.remove('actions-visible');
    if (activeActionKey === wrapEl.id) activeActionKey = null;
    lineStyleHideTimer = null;
  }, 3000);
}

function toggleLineStylePopup(ev, wrapId) {
  ev.stopPropagation();
  const wrapEl = document.getElementById(wrapId);
  if (!wrapEl) return;
  const wasOpen = wrapEl.classList.contains('actions-visible');
  hideAllActions();
  if (!wasOpen) {
    wrapEl.classList.add('actions-visible');
    activeActionKey = wrapId;
    scheduleLineStyleHide(wrapEl);
  }
}

function setupLineStylePopupAutoExtend(wrapId) {
  const wrapEl = document.getElementById(wrapId);
  if (!wrapEl) return;
  const popupEl = wrapEl.querySelector('.line-style-popup');
  if (!popupEl) return;
  ["pointerdown", "input", "click"].forEach((evtName) => {
    popupEl.addEventListener(evtName, () => {
      if (wrapEl.classList.contains('actions-visible')) scheduleLineStyleHide(wrapEl);
    });
  });
}

function getLabelValue(key, defaultText) {
  const label = (cloudSettings.labels && cloudSettings.labels[key]) || { text: null, hidden: false };
  if (label.hidden) return "";
  return (label.text !== null && label.text !== undefined && label.text !== "") ? label.text : defaultText;
}

function getLabelAnimations(key) {
  const label = cloudSettings.labels && cloudSettings.labels[key];
  if (!label) return [];
  return normalizeAnimationIds(label.animations, label.animation);
}

function setLabelAnimations(key, animIds) {
  if (!cloudSettings.labels) cloudSettings.labels = defaultLabels();
  const existing = cloudSettings.labels[key] || { text: null, hidden: false };
  // animation:null clears out the old single-id field so a stale legacy value
  // can never re-appear once a label has been re-saved with the new format.
  cloudSettings.labels[key] = { text: existing.text, hidden: existing.hidden, animations: animIds, animation: null };
  return saveCloudSettings(cloudSettings);
}

function editLabel(key, defaultText) {
  const label = (cloudSettings.labels && cloudSettings.labels[key]) || { text: null, hidden: false };
  const current = label.hidden ? "" : ((label.text !== null && label.text !== undefined) ? label.text : defaultText);
  const val = prompt("Edit text:", current);
  if (val === null) return;
  if (!cloudSettings.labels) cloudSettings.labels = defaultLabels();
  cloudSettings.labels[key] = { text: val, hidden: false, animations: normalizeAnimationIds(label.animations, label.animation) };
  renderAll();
  setSyncStatus("Saving...");
  saveCloudSettings(cloudSettings).then(() => setSyncStatus("Synced")).catch(() => {
    setSyncStatus("Sync failed");
    alert("Could not save. Please check your internet connection and try again.");
  });
  hideAllActions();
}

function deleteLabel(key) {
  if (!confirm("Delete this line?")) return;
  if (!cloudSettings.labels) cloudSettings.labels = defaultLabels();
  const label = cloudSettings.labels[key] || {};
  cloudSettings.labels[key] = { text: "", hidden: true, animations: normalizeAnimationIds(label.animations, label.animation) };
  renderAll();
  setSyncStatus("Saving...");
  saveCloudSettings(cloudSettings).then(() => setSyncStatus("Synced")).catch(() => {
    setSyncStatus("Sync failed");
    alert("Could not save. Please check your internet connection and try again.");
  });
  hideAllActions();
}

function applyFontSettingsToContainer(containerId, settings) {
  const container = document.getElementById(containerId);
  FONT_TARGETS.forEach((target) => {
    const s = settings[target] || DEFAULT_PAGE_SETTINGS[target];
    container.style.setProperty(`--${target}-size`, s.size + "px");
    container.style.setProperty(`--${target}-color`, s.color);
    container.style.setProperty(`--${target}-font`, s.font);
    container.style.setProperty(`--${target}-weight`, s.bold ? "700" : "400");
  });
}

function applyPageBackground(page) {
  const settings = getSavedFontSettings(page);
  const bg = settings.background || "#ffffff";
  document.body.style.backgroundColor = bg;
  document.documentElement.style.setProperty("--page-bg", bg);
  // Set it directly on both header bars too (belt-and-braces): the header is
  // position:fixed and was relying only on the --page-bg CSS variable, which
  // left it showing white in some cases even after the page background changed.
  const headerAlerts = document.getElementById("header-alerts");
  const headerData = document.getElementById("header-data");
  if (headerAlerts) headerAlerts.style.backgroundColor = bg;
  if (headerData) headerData.style.backgroundColor = bg;
}

function fillSettingsForm(settings) {
  FONT_TARGETS.forEach((target) => {
    const s = settings[target] || DEFAULT_PAGE_SETTINGS[target];
    document.getElementById(`${target}-size`).value = s.size;
    document.getElementById(`${target}-color`).value = s.color;
    document.getElementById(`${target}-font`).value = s.font;
    document.getElementById(`${target}-bold`).checked = !!s.bold;
  });
  document.getElementById("page-bg-color").value = settings.background || "#ffffff";
}

function readSettingsForm() {
  const settings = {};
  FONT_TARGETS.forEach((target) => {
    settings[target] = {
      size: parseInt(document.getElementById(`${target}-size`).value, 10) || DEFAULT_PAGE_SETTINGS[target].size,
      color: document.getElementById(`${target}-color`).value,
      font: document.getElementById(`${target}-font`).value,
      bold: document.getElementById(`${target}-bold`).checked
    };
  });
  settings.background = document.getElementById("page-bg-color").value;
  return settings;
}

let currentAnimTarget = null;
// Array of up to 3 animation ids, so any line/label/reminder can combine several
// animations at once (e.g. Zoom Out + Zoom In together) instead of just one.
let currentAnimSelections = [];
const MAX_ANIMATIONS_PER_ITEM = 3;

let currentAnimSpeedChoice = "normal";

function applyAnimSpeedToPage(speedKey) {
  const mult = ANIM_SPEED_MULTIPLIERS[speedKey] || 1;
  document.documentElement.style.setProperty("--la-speed", mult);
}

function updateAnimSpeedUI() {
  const row = document.getElementById("animSpeedRow");
  if (!row) return;
  row.querySelectorAll(".anim-speed-btn").forEach((btn) => {
    btn.classList.toggle("selected", btn.getAttribute("data-speed") === currentAnimSpeedChoice);
  });
}

function setAnimSpeedChoice(speedKey) {
  currentAnimSpeedChoice = speedKey;
  applyAnimSpeedToPage(speedKey);
  updateAnimSpeedUI();
}

function openAnimationPage(type, key, currentAnimIds) {
  currentAnimTarget = type ? { type, key } : null;
  if (type === "label") {
    currentAnimSelections = getLabelAnimations(key);
  } else if (type === "event") {
    currentAnimSelections = normalizeAnimationIds(currentAnimIds, null);
  } else {
    currentAnimSelections = [];
  }
  currentAnimSpeedChoice = (cloudSettings.animSpeed) || "normal";
  updateAnimSpeedUI();
  renderAnimPickerList();
  document.getElementById("animationOverlay").classList.add("open");
  hideAllActions();
}

function closeAnimationPage() {
  document.getElementById("animationOverlay").classList.remove("open");
}

function replayPreview(el) {
  const cls = el.className;
  el.className = "anim-pick-preview";
  void el.offsetWidth;
  el.className = cls;
}

function renderAnimPickerList() {
  const hintEl = document.getElementById("animPickHint");
  if (hintEl) {
    hintEl.textContent = currentAnimSelections.length
      ? `${currentAnimSelections.length}/${MAX_ANIMATIONS_PER_ITEM} selected — tap a number to pick its order, tap again to remove`
      : `Pick up to ${MAX_ANIMATIONS_PER_ITEM} animations to combine on this line`;
  }
  const listEl = document.getElementById("animPickerList");
  listEl.innerHTML = "";
  ANIMATIONS.forEach((a) => {
    const row = document.createElement("div");
    const selectedIndex = currentAnimSelections.indexOf(a.id);
    const isSelected = a.id === "none" ? currentAnimSelections.length === 0 : selectedIndex !== -1;
    row.className = "anim-pick-row" + (isSelected ? " selected" : "");
    const previewCls = a.id === "none" ? "anim-pick-preview" : ("anim-pick-preview la-" + a.id);
    const orderBadge = (a.id !== "none" && selectedIndex !== -1) ? `<span class="anim-pick-order">${selectedIndex + 1}</span>` : "";
    row.innerHTML = `<span class="anim-pick-name">${orderBadge}${a.name}</span><span class="${previewCls}">Aa</span>`;
    row.addEventListener("click", () => {
      if (a.id === "none") {
        currentAnimSelections = [];
      } else if (currentAnimSelections.includes(a.id)) {
        currentAnimSelections = currentAnimSelections.filter((id) => id !== a.id);
      } else {
        if (currentAnimSelections.length >= MAX_ANIMATIONS_PER_ITEM) currentAnimSelections.shift();
        currentAnimSelections.push(a.id);
      }
      renderAnimPickerList();
    });
    listEl.appendChild(row);
  });
}

// Rewritten to fix two real bugs:
// 1) The old version fired TWO separate, un-awaited writes to the same Firebase
//    location back to back (one before the animation change was even applied
//    locally, one after) with no error handling — if either write failed
//    (offline, slow connection, etc.) it failed silently, which is exactly why
//    a newly-set animation could vanish again after a refresh.
// 2) For reminders on the List page, the screen only ever updated after
//    Firebase echoed the write back, so if that round trip was slow or failed,
//    tapping Apply looked like it did nothing at all.
// Now there is exactly one save per Apply tap, the screen updates immediately
// (optimistic update) instead of waiting on the network, and any real failure
// is shown to you instead of failing silently.
async function applyAnimationChoice() {
  const animIds = currentAnimSelections.slice();
  cloudSettings.animSpeed = currentAnimSpeedChoice;
  applyAnimSpeedToPage(currentAnimSpeedChoice);

  const applyBtn = document.getElementById("animApplyBtn");
  if (applyBtn) { applyBtn.disabled = true; applyBtn.textContent = "Saving..."; }
  setSyncStatus("Saving...");

  if (!settingsRef || (currentAnimTarget && currentAnimTarget.type === "event" && !eventsRef)) {
    setSyncStatus("Offline");
    if (applyBtn) { applyBtn.disabled = false; applyBtn.textContent = "Apply"; }
    alert("Not connected to the database right now, so this can't be saved.\n\nThis usually means the page was opened as a local/downloaded file instead of your real website address (the address bar shows something other than https://). Please open the site at its actual https:// link and try again.");
    return;
  }

  try {
    if (currentAnimTarget && currentAnimTarget.type === "event" && eventsRef && currentAnimTarget.key) {
      const idx = latestRawEvents.findIndex((ev) => ev.key === currentAnimTarget.key);
      if (idx !== -1) {
        latestRawEvents[idx] = { ...latestRawEvents[idx], animations: animIds, animation: null };
        renderAll();
      }
      await eventsRef.child(currentAnimTarget.key).update({ animations: animIds, animation: null });
      await saveCloudSettings(cloudSettings);
    } else if (currentAnimTarget && currentAnimTarget.type === "label") {
      if (!cloudSettings.labels) cloudSettings.labels = defaultLabels();
      const existing = cloudSettings.labels[currentAnimTarget.key] || { text: null, hidden: false };
      cloudSettings.labels[currentAnimTarget.key] = { text: existing.text, hidden: existing.hidden, animations: animIds, animation: null };
      renderAll();
      await saveCloudSettings(cloudSettings);
    } else {
      await saveCloudSettings(cloudSettings);
    }
    setSyncStatus("Synced");
    closeAnimationPage();
  } catch (err) {
    setSyncStatus("Sync failed");
    const reason = (err && err.message) ? err.message : "unknown error";
    alert("Animation could not be saved.\n\nReason: " + reason + "\n\nIf this keeps happening, check that this page is opened at your real website address (https://...), not a local/downloaded file — Firebase often can't connect from a locally opened file regardless of internet speed.");
  } finally {
    if (applyBtn) { applyBtn.disabled = false; applyBtn.textContent = "Apply"; }
  }
}

async function applySettings() {
  configDrafts[currentConfigTab] = readSettingsForm();
  cloudSettings.alerts = configDrafts.alerts;
  cloudSettings.data = configDrafts.data;
  applyFontSettingsToContainer("page-alerts", cloudSettings.alerts);
  applyFontSettingsToContainer("page-data", cloudSettings.data);
  applyPageBackground(getActivePageName());
  loadAll();
  setSyncStatus("Saving...");
  try {
    await saveCloudSettings(cloudSettings);
    setSyncStatus("Synced");
  } catch (err) {
    setSyncStatus("Sync failed");
  }
  closeSettings();
}

function resetSettings() {
  const defaults = cloneDefaults();
  configDrafts[currentConfigTab] = defaults;
  fillSettingsForm(defaults);
}

if (settingsRef) {
  settingsRef.on("value", (snapshot) => {
    const val = snapshot.val();
    if (val) {
      if (val.alerts) cloudSettings.alerts = val.alerts;
      if (val.data) cloudSettings.data = val.data;
      if (val.labels) cloudSettings.labels = val.labels;
      if (val.thresholds) {
        cloudSettings.thresholds = val.thresholds;
        ALERT_THRESHOLD_DAYS = val.thresholds.days || ALERT_THRESHOLD_DAYS;
        CYLINDER_THRESHOLD_VALUE = (val.thresholds.cylinder !== undefined) ? val.thresholds.cylinder : CYLINDER_THRESHOLD_VALUE;
      }
      if (val.animSpeed) {
        cloudSettings.animSpeed = val.animSpeed;
        applyAnimSpeedToPage(val.animSpeed);
      }
      if (val.headerLine) {
        cloudSettings.headerLine = val.headerLine;
        syncLineStyleUI();
      }
      applyFontSettingsToContainer("page-alerts", cloudSettings.alerts);
      applyFontSettingsToContainer("page-data", cloudSettings.data);
      applyPageBackground(getActivePageName());
      loadAll();
      setSyncStatus("Synced");
    } else {
      setSyncStatus("");
    }
  }, (error) => {
    setSyncStatus("Sync error");
    console.error("Settings sync error:", error);
  });
} else {
  setSyncStatus("Offline");
}

// Auto-update checker: detects new deployment (or a stale cached page) and reloads automatically
(function(){
  const metaTag = document.querySelector('meta[name="build-id"]');
  const CURRENT_BUILD_ID = metaTag ? metaTag.getAttribute("content") : null;
  let reloading = false;
  async function checkForUpdate(){
    if (reloading) return;
    try{
      const res = await fetch(location.pathname + "?_=" + Date.now(), { cache: "no-store" });
      const text = await res.text();
      const match = text.match(/<meta name="build-id" content="([^"]*)"/);
      const latestBuildId = match ? match[1] : null;
      if(latestBuildId && CURRENT_BUILD_ID && latestBuildId !== CURRENT_BUILD_ID){
        reloading = true;
        location.href = location.pathname + "?_=" + Date.now();
      }
    }catch(e){}
  }
  // Run immediately: this also catches the case where the browser served
  // an old cached copy of this page on manual refresh, not just future deployments.
  checkForUpdate();
  setInterval(checkForUpdate, 3000);
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden){
      checkForUpdate();
    }
  });
  window.addEventListener("focus", checkForUpdate);
})();
