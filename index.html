<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reminders</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow-x: hidden; }
  body {
    background: #ffffff;
    color: #000000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    padding: 70px 20px 80px;
    max-width: 640px;
    margin: 0 auto;
  }
  .header-date { font-size: var(--header-size, 19px); color: var(--header-color, #000000); font-family: var(--header-font, inherit); font-weight: var(--header-weight, 400); margin-bottom: 28px; }
  .event { margin-bottom: 30px; position: relative; }
  .event-name { color: var(--name-color, #000000); font-size: var(--name-size, 20px); font-family: var(--name-font, inherit); font-weight: var(--name-weight, 400); margin-bottom: 10px; line-height: 1.15; }
  .alerts-page-title { text-align: center; color: var(--title-color, #b266b2); font-size: var(--title-size, 26px); font-family: var(--title-font, inherit); font-weight: var(--title-weight, 700); }
  .alerts-page-title-row { display: flex; align-items: center; justify-content: center; gap: 6px; margin: -42px 0 22px; }
  .header-line-group { display: inline-flex; align-items: baseline; gap: 4px; }
  .line-wrap { position: relative; display: inline-flex; align-items: baseline; }
  .line-wrap.actions-visible .event-actions { opacity: 1; pointer-events: auto; }
  .line-wrap .event-actions { top: 100%; left: 50%; transform: translate(-50%, 8px); }
  .event-countdown { color: var(--countdown-color, #ff0000); font-size: var(--countdown-size, 26px); font-family: var(--countdown-font, inherit); font-weight: var(--countdown-weight, 700); margin-bottom: 10px; line-height: 1.1; }
  .event-date { color: var(--date-color, #000000); font-size: var(--date-size, 15px); font-family: var(--date-font, inherit); font-weight: var(--date-weight, 400); line-height: 1.1; }
  #list-alerts { display: flex; flex-direction: column; align-items: flex-start; max-width: fit-content; margin: 0 auto; width: 100%; }
  #list-alerts .event { text-align: left; }
  #list-data { display: flex; flex-direction: column; align-items: flex-start; width: 100%; }
  #list-data .event { text-align: left; width: 100%; }
  .empty-state { color: #555; font-size: 16px; margin-top: 12px; text-align: center; width: 100%; }
  .refreshing-state { position: fixed; top: calc(50% - 96px); left: 50%; transform: translate(-50%, -50%); color: #555; font-size: 22px; text-align: center; width: 100%; }
  .dots-bold { font-weight: bold; color: #000; }
  .loading { color: #555; text-align: center; width: 100%; }
  .page { display: none; }
  .page.active { display: block; }

  #page-alerts, #page-data {
    padding-top: 50px;
  }
  #page-data {
    padding-top: 0px;
  }
  #page-alerts .header-date, #page-data .header-date {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: #ffffff;
    z-index: 20;
    padding: 8px 20px 0px 20px;
    margin: 0 auto;
    max-width: 640px;
  }
  .header-date-inner {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 2px solid #e75480;
    padding-bottom: 8px;
  }

  .settings-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 30; align-items: flex-end; justify-content: center; }
  .settings-overlay.open { display: flex; }
  #addReminderOverlay { align-items: center; }
  #settingsOverlay { align-items: center; }
  #settingsOverlay .settings-panel { border-radius: 16px; max-height: 85vh; }
  #addReminderOverlay .settings-panel { border-radius: 16px; }
  .settings-panel { background: #ffffff; width: 100%; max-width: 640px; max-height: 85vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 20px; }
  .settings-title { display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: 700; margin-bottom: 16px; }
  .settings-title button { background: none; border: none; font-size: 20px; cursor: pointer; color: #000000; }
  .settings-page-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .cfgtab { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ddd; background: #f5f5f5; color: #000; font-size: 20px; font-weight: 600; cursor: pointer; }
  .cfgtab.active { background: #d40000; color: #ffffff; border-color: #d40000; }
  .settings-row { border-top: 1px solid #eee; padding: 14px 0; }
  .settings-row-label { font-weight: 600; font-size: 15px; margin-bottom: 10px; }
  .settings-row-label-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .settings-row-label-flex .settings-row-label { margin-bottom: 0; }
  .settings-row-close { background: none; border: none; font-size: 20px; font-weight: 700; cursor: pointer; color: #000000; padding: 0; line-height: 1; }
  .settings-controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: center; }
  .settings-controls label { font-size: 24px; color: #555; display: block; margin-bottom: 2px; text-align: center; }
  .settings-controls label.lbl-sm { font-size: 22px; }
  .settings-field { display: flex; flex-direction: column; align-items: center; }
  .settings-field input[type="number"] { width: 64px; padding: 6px; border: 1px solid #ccc; border-radius: 6px; font-size: 22px; }
  .settings-field select { padding: 6px; border: 1px solid #ccc; border-radius: 6px; max-width: 140px; font-size: 18px; }
  .color-combo { display: flex; gap: 6px; align-items: center; justify-content: center; }
  .color-combo input[type="color"] { width: 34px; height: 34px; padding: 0; border: 1px solid #ccc; border-radius: 6px; }
  .settings-field-bold { display: flex; flex-direction: column; align-items: center; }
  .settings-field-bold input[type="checkbox"] { width: 20px; height: 20px; margin-top: 4px; }
  .settings-actions { display: flex; gap: 10px; margin-top: 18px; }
  .settings-actions button { flex: 1; padding: 12px; border-radius: 8px; border: none; font-size: 20px; font-weight: 700; cursor: pointer; }
  .settings-apply { background: #d40000; color: #ffffff; }
  .settings-reset { background: #eee; color: #000000; }
  .sync-status { position: fixed; top: 18px; left: 16px; font-size: 11px; color: #ffffff; z-index: 15; }

  .page-toggle-btn {
    position: fixed;
    top: 50%;
    right: 0;
    transform: translateY(calc(-50% - 108px));
    background: transparent;
    color: var(--nav-icon-color, #b9b7b5);
    border: none;
    padding: 0;
    width: 48px;
    height: 48px;
    font-size: 28px;
    font-weight: 700;
    cursor: pointer;
    z-index: 15;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    pointer-events: auto;
  }
  .page-toggle-btn .toggle-icon {
    display: inline-block;
    transition: transform 0.4s ease;
  }

  .settings-icon {
    position: fixed;
    top: 50%;
    right: 0;
    transform: translateY(calc(-50% - 48px));
    background: transparent;
    color: var(--nav-icon-color, #b9b7b5);
    border: none;
    width: 48px;
    height: 48px;
    font-size: 26px;
    cursor: pointer;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .anim-icon-btn {
    position: fixed;
    top: 50%;
    right: 0;
    transform: translateY(calc(-50% + 12px));
    background: transparent;
    color: var(--nav-icon-color, #b9b7b5);
    border: none;
    padding: 0;
    width: 48px;
    height: 48px;
    font-size: 26px;
    font-weight: 700;
    cursor: pointer;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  #animationOverlay { align-items: center; }
  #animationOverlay .settings-panel { border-radius: 0; height: calc(100vh - 2in); max-height: calc(100vh - 2in); width: 100%; max-width: 100%; margin: 0; display: flex; flex-direction: column; background: #ffffff; }
  #animationOverlay .settings-title span { color: #000000; }
  #animationOverlay .settings-title button { color: #000000; }
  #animationOverlay .settings-actions { margin-top: auto; justify-content: center; }
  #animationOverlay .settings-actions button { flex: none; width: 25%; }

  .add-icon-btn {
    position: fixed;
    top: 50%;
    right: 0;
    transform: translateY(calc(-50% - 168px));
    background: transparent;
    color: var(--nav-icon-color, #b9b7b5);
    border: none;
    padding: 0;
    width: 48px;
    height: 48px;
    font-size: 28px;
    font-weight: 700;
    cursor: pointer;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .add-field-row { display: flex; }
  .add-field-row input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 18px; color: #000; }
  .add-field-row input[type="number"] { width: 100px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 18px; color: #000; }
  .add-alert-type-row { align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
  .add-date-counter-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .date-input-small { width: 165px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 18px; color: #000; }
  .date-col { display: flex; flex-direction: column; }
  .alert-col { display: flex; flex-direction: column; }
  .alert-col input[type="number"] { width: 70px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 18px; color: #000; }
  .counter-col { display: flex; flex-direction: column; align-items: flex-start; }
  .add-type-group { display: flex; align-items: center; gap: 18px; }
  .add-type-group-vertical { flex-direction: column; align-items: flex-start; gap: 6px; }
  .add-type-row { gap: 20px; align-items: center; }
  .add-type-row label, .add-alert-type-row label { display: flex; align-items: center; gap: 6px; font-size: 17px; color: #000; }
  .add-type-row input[type="radio"], .add-alert-type-row input[type="radio"] { width: 18px; height: 18px; }
  .event-actions { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: row; align-items: center; gap: 16px; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 18px rgba(0,0,0,0.28); padding: 10px 16px; opacity: 0; pointer-events: none; transition: opacity 0.15s ease; z-index: 12; }
  .event.actions-visible .event-actions { opacity: 1; pointer-events: auto; }
  .event-actions button { background: none; border: none; cursor: pointer; padding: 4px; line-height: 1; display: flex; align-items: center; justify-content: center; }
  .event-actions button svg { width: 20px; height: 20px; }
  .event-edit-btn { color: #555555; }
  .event-delete-btn { color: #555555; }
  .event-move-up-btn, .event-move-down-btn { color: #555555; }
  .event-action-disabled { opacity: 0.25; cursor: default; pointer-events: none; }
  .settings-controls:has(#header-size), .settings-controls:has(#title-size), .settings-controls:has(#name-size), .settings-controls:has(#countdown-size), .settings-controls:has(#date-size) { justify-content: space-between; }
  .settings-controls:has(#page-bg-color) { justify-content: flex-start; }
  .settings-controls:has(#page-bg-color) .settings-field { align-items: flex-start; }
  .settings-controls:has(#page-bg-color) label { text-align: left; }
  .settings-row:has(#header-size), .settings-row:has(#title-size), .settings-row:has(#name-size), .settings-row:has(#countdown-size), .settings-row:has(#date-size) { border: 1px solid #555555; border-top: 1px solid #555555; border-radius: 6px; padding: 8px 10px; margin-bottom: 10px; }

  /* Gas Cylinder graphic */
  .gas-row{ display:flex; align-items:center; justify-content:space-between; gap:14px; width:100%; }
  .gas-left{ display:flex; flex-direction:column; gap:0px; min-width:0; flex:1; }
  .cylinder-wrap-side{ flex-shrink:0; display:flex; align-items:center; margin-top:14px; transform: translate(-0.5in, -0.5cm); }
  #list-data .cylinder-wrap-side{ margin-top:0px; margin-left:-216px; transform: translate(-0.5in, calc(-0.5cm + 34px)); }
  @keyframes wiggle{
    0%, 100%{ transform:rotate(0deg) translateX(0); }
    20%{ transform:rotate(-4deg) translateX(-1px); }
    40%{ transform:rotate(4deg) translateX(1px); }
    60%{ transform:rotate(-3deg) translateX(-1px); }
    80%{ transform:rotate(3deg) translateX(1px); }
  }
  .cylinder{ position:relative; width:50px; height:92px; transform-origin:bottom center; animation:wiggle 3.2s ease-in-out infinite; }
  .cylinder .cyl-top-collar { position:absolute; top:0; left:50%; transform:translateX(-50%); width:31px; height:10px; border:2.5px solid #c81e1e; border-radius:50%; box-shadow:inset 0 2px 3px rgba(0,0,0,0.5); }
  .cylinder .cyl-support-pillars { position:absolute; top:7px; left:50%; transform:translateX(-50%); width:29px; height:14px; }
  .cylinder .cyl-support-pillars::before, .cylinder .cyl-support-pillars::after, .cylinder .cyl-pillar-center { content:''; position:absolute; top:0; width:2.5px; height:14px; background:linear-gradient(180deg, #d32020, #961111); border-radius:1px; }
  .cylinder .cyl-support-pillars::before { left:2px; }
  .cylinder .cyl-support-pillars::after { right:2px; }
  .cylinder .cyl-pillar-center { left:50%; transform:translateX(-50%); width:2.5px; }
  .cylinder .cyl-valve-tag { position:absolute; top:9px; left:50%; transform:translateX(-50%); width:8px; height:10px; background:#e0d8b0; border:1px solid #a89f78; border-radius:1px; z-index:2; }
  .cylinder .cyl-valve-tag::after { content:''; position:absolute; top:3px; left:50%; transform:translateX(-50%); width:4px; height:4px; background:#e63939; border-radius:50%; }
  .cylinder .cyl-dome{ position:absolute; top:19px; left:50%; transform:translateX(-50%); width:46px; height:20px; background:radial-gradient(ellipse at top, #f03232 0%, #c81e1e 60%, #820e0e 100%); border-radius:50% 50% 0 0 / 100% 100% 0 0; box-shadow:inset 0 3px 5px rgba(255,255,255,0.3); }
  .cylinder .cyl-dome-text { position:absolute; top:25px; left:50%; transform:translateX(-50%); font-size:5.5px; font-weight:700; color:rgba(0,0,0,0.6); letter-spacing:0.4px; white-space:nowrap; }
  .cylinder .cyl-body{ position:absolute; top:38px; left:50%; transform:translateX(-50%); width:48px; height:44px; background:linear-gradient(90deg, #7a0c0c 0%, #e62828 20%, #ff5252 45%, #c81e1e 75%, #520606 100%); border-radius:2px; box-shadow:inset 0 0 8px rgba(0,0,0,0.5), inset 4px 0 5px rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; }
  .cylinder .cyl-weld-line { position:absolute; top:60px; left:50%; transform:translateX(-50%); width:48px; height:2px; background:rgba(0,0,0,0.35); box-shadow:0 1px 1px rgba(255,255,255,0.15); z-index:3; }
  .cylinder .indian-gas-container { position:absolute; top:44px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:4; width:100%; }
  .cylinder .indian-text { font-family:'Inter', sans-serif; font-weight:700; font-size:9px; letter-spacing:0.4px; color:#ffffff; line-height:1; text-shadow:0 1px 2px rgba(0,0,0,0.8); }
  .cylinder .cyl-foot{ position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:42px; height:10px; background:linear-gradient(180deg, #d32020, #a81616); border-radius:0 0 6px 6px; border-top:1.5px solid #820e0e; display:flex; justify-content:space-around; align-items:flex-end; padding-bottom:2px; }
  .cylinder .cyl-foot-hole { width:7px; height:3px; background:#f8f9fa; border-radius:2px 2px 0 0; }
</style>
</head>
<body>

<div id="syncStatus" class="sync-status"></div>
<button id="pageToggleBtn" class="page-toggle-btn" onclick="togglePage()" title="Switch page"><span id="toggleIcon" class="toggle-icon">⇄</span></button>
<button class="settings-icon" onclick="openSettings()" title="Settings">⚙</button>
<button class="add-icon-btn" onclick="openAddReminder()" title="Add New Reminder">+</button>
<button class="anim-icon-btn" onclick="openAnimationPage()" title="Line Animation">A</button>

<div id="animationOverlay" class="settings-overlay">
  <div class="settings-panel">
    <div class="settings-title"><span></span><button onclick="closeAnimationPage()" title="Close">✕</button></div>
    <div class="settings-actions">
      <button class="settings-apply" onclick="closeAnimationPage()">Apply</button>
    </div>
  </div>
</div>

<div id="settingsOverlay" class="settings-overlay">
  <div class="settings-panel">
    <div class="settings-title"><span>Settings</span></div>
    <div class="settings-page-tabs">
      <button id="cfgtab-alerts" class="cfgtab active" onclick="switchConfigTab('alerts')">Alerts Page</button>
      <button id="cfgtab-data" class="cfgtab" onclick="switchConfigTab('data')">List Page</button>
    </div>
    <div class="settings-row">
      <div class="settings-row-label-flex">
        <div class="settings-row-label">Page Background</div>
        <button class="settings-row-close" onclick="closeSettings()" title="Close">✕</button>
      </div>
      <div class="settings-controls">
        <div class="settings-field"><label>Color</label><div class="color-combo"><input type="color" id="page-bg-color"></div></div>
      </div>
    </div>
    <div class="settings-row">
      <div class="settings-row-label">Today Date</div>
      <div class="settings-controls">
        <div class="settings-field"><label>Size</label><input type="number" id="header-size" min="8" max="60"></div>
        <div class="settings-field"><label class="lbl-sm">Color</label><div class="color-combo"><input type="color" id="header-color"></div></div>
        <div class="settings-field"><label class="lbl-sm">Font Style</label><select id="header-font"></select></div>
        <div class="settings-field-bold"><label>Bold</label><input type="checkbox" id="header-bold"></div>
      </div>
    </div>
    <div class="settings-row">
      <div class="settings-row-label">Alert Title</div>
      <div class="settings-controls">
        <div class="settings-field"><label>Size</label><input type="number" id="title-size" min="8" max="60"></div>
        <div class="settings-field"><label class="lbl-sm">Color</label><div class="color-combo"><input type="color" id="title-color"></div></div>
        <div class="settings-field"><label class="lbl-sm">Font Style</label><select id="title-font"></select></div>
        <div class="settings-field-bold"><label>Bold</label><input type="checkbox" id="title-bold"></div>
      </div>
    </div>
    <div class="settings-row">
      <div class="settings-row-label">List Name</div>
      <div class="settings-controls">
        <div class="settings-field"><label>Size</label><input type="number" id="name-size" min="8" max="60"></div>
        <div class="settings-field"><label class="lbl-sm">Color</label><div class="color-combo"><input type="color" id="name-color"></div></div>
        <div class="settings-field"><label class="lbl-sm">Font Style</label><select id="name-font"></select></div>
        <div class="settings-field-bold"><label>Bold</label><input type="checkbox" id="name-bold"></div>
      </div>
    </div>
    <div class="settings-row">
      <div class="settings-row-label">Day Left</div>
      <div class="settings-controls">
        <div class="settings-field"><label>Size</label><input type="number" id="countdown-size" min="8" max="60"></div>
        <div class="settings-field"><label class="lbl-sm">Color</label><div class="color-combo"><input type="color" id="countdown-color"></div></div>
        <div class="settings-field"><label class="lbl-sm">Font Style</label><select id="countdown-font"></select></div>
        <div class="settings-field-bold"><label>Bold</label><input type="checkbox" id="countdown-bold"></div>
      </div>
    </div>
    <div class="settings-row">
      <div class="settings-row-label">Target Date</div>
      <div class="settings-controls">
        <div class="settings-field"><label>Size</label><input type="number" id="date-size" min="8" max="60"></div>
        <div class="settings-field"><label class="lbl-sm">Color</label><div class="color-combo"><input type="color" id="date-color"></div></div>
        <div class="settings-field"><label class="lbl-sm">Font Style</label><select id="date-font"></select></div>
        <div class="settings-field-bold"><label>Bold</label><input type="checkbox" id="date-bold"></div>
      </div>
    </div>
    <div class="settings-actions">
      <button class="settings-reset" onclick="resetSettings()">Reset (this page)</button>
      <button class="settings-apply" onclick="applySettings()">Apply</button>
    </div>
  </div>
</div>

<!-- PAGE 1: Alerts -->

function parseEventDateString(dateStr) {
  const parts = String(dateStr).trim().split(/[-.\/]/).map((p) => parseInt(p, 10));
  if (parts.length !== 3 || parts.some((p) => isNaN(p))) return null;
  const [d, m, y] = parts;
  const dt = new Date(y, m - 1, d);
  dt.setHours(0, 0, 0, 0);
  return dt;
}

function formatDisplayDate(dt) {
  const d = String(dt.getDate()).padStart(2, "0");
  const m = String(dt.getMonth() + 1).padStart(2, "0");
  const y = dt.getFullYear();
  return `${d}/${m}/${y}`;
}

function getTodayMidnight() {
  const t = new Date();
  t.setHours(0, 0, 0, 0);
  return t;
}

function getCylinderThresholdParts() {
  const months = Math.floor(CYLINDER_THRESHOLD_VALUE);
  const days = Math.round((CYLINDER_THRESHOLD_VALUE - months) * 100);
  return { months, days };
}

function getHeaderText() {
  const today = getTodayMidnight();
  const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  return `Today - ${formatDisplayDate(today)} (${dayNames[today.getDay()]})`;
}

function buildEventDisplay(rawName, rawDate, rawType, rawAlertDays, rawKey) {
  const eventDate = parseEventDateString(rawDate);
  if (!eventDate) return null;
  const today = getTodayMidnight();
  const name = rawName || "";
  const displayDate = formatDisplayDate(eventDate);
  const type = (rawType || "countdown").toLowerCase();
  const alertDays = (rawAlertDays !== undefined && rawAlertDays !== null && !isNaN(rawAlertDays)) ? Number(rawAlertDays) : null;

  if (type === "elapsed") {
    const elapsedDays = Math.max(0, Math.round((today - eventDate) / 86400000));
    const months = Math.floor(elapsedDays / 30);
    const days = elapsedDays % 30;
    const countdown = months === 0 ? `${days} . Days` : `${months} . Months - ${days} . Days`;
    let isAlert = false;
    if (alertDays !== null) {
      isAlert = elapsedDays >= alertDays;
    } else {
      const { months: thMonths, days: thDays } = getCylinderThresholdParts();
      if (months > thMonths) isAlert = true;
      else if (months === thMonths) isAlert = days >= thDays;
    }
    return { name, date: displayDate, countdown, isAlert, key: rawKey };
  }

  const diffDays = Math.round((eventDate - today) / 86400000);
  if (diffDays < 0) {
    return { name, date: displayDate, countdown: "Expired", isAlert: true, key: rawKey };
  }
  const countdown = `${diffDays} . Day Left`;
  const isAlert = diffDays <= (alertDays !== null ? alertDays : ALERT_THRESHOLD_DAYS);
  return { name, date: displayDate, countdown, isAlert, key: rawKey };
}


let activeActionKey = null;
let actionsHideTimer = null;

function hideAllActions() {
  document.querySelectorAll('.event.actions-visible, .line-wrap.actions-visible').forEach((el) => el.classList.remove('actions-visible'));
  activeActionKey = null;
  if (actionsHideTimer) { clearTimeout(actionsHideTimer); actionsHideTimer = null; }
}

function toggleItemActions(itemEl, key, timeoutMs) {
  if (actionsHideTimer) { clearTimeout(actionsHideTimer); actionsHideTimer = null; }
  const wasOpen = itemEl.classList.contains('actions-visible');
  hideAllActions();
  if (!wasOpen) {
    itemEl.classList.add('actions-visible');
    activeActionKey = key;
    actionsHideTimer = setTimeout(() => {
      itemEl.classList.remove('actions-visible');
      activeActionKey = null;
    }, timeoutMs || 4000);
  }
}

document.addEventListener('click', (e) => {
  if (!activeActionKey) return;
  const openItem = document.querySelector('.event.actions-visible, .line-wrap.actions-visible');
  if (openItem && !openItem.contains(e.target)) hideAllActions();
});

function attachLongPress(item, onLongPress) {
  let timer = null;
  const clear = () => { if (timer) { clearTimeout(timer); timer = null; } };
  const start = () => { clear(); timer = setTimeout(onLongPress, 500); };
  item.addEventListener('touchstart', start, { passive: true });
  item.addEventListener('touchend', clear);
  item.addEventListener('touchmove', clear, { passive: true });
  item.addEventListener('touchcancel', clear);
  item.addEventListener('mousedown', start);
  item.addEventListener('mouseup', clear);
  item.addEventListener('mouseleave', clear);
}

["lw-header-alerts", "lw-header-data", "lw-header-count", "lw-alert-title"].forEach((id) => {
  const el = document.getElementById(id);

    el.addEventListener("click", (ev) => {

      toggleItemActions(el, id, 3000);

  }
});

            <div class="event-countdown">${e.countdown}</div>

          <div class="cylinder-wrap-side">

              <div class="cyl-top-collar"></div>
              <div class="cyl-support-pillars"><div class="cyl-pillar-center"></div></div>
              <div class="cyl-valve-tag"></div>
              <div class="cyl-dome"></div>
              <div class="cyl-dome-text">14.2 kg</div>
              <div class="cyl-body"></div>
              <div class="cyl-weld-line"></div>
              <div class="indian-gas-container"><div class="indian-text">INDIAN</div></div>
              <div class="cyl-foot">
                <div class="cyl-foot-hole"></div><div class="cyl-foot-hole"></div><div class="cyl-foot-hole"></div>
              </div>
            </div>
          </div>
        </div>
      `;
    } else {
      contentHTML = `<div class="event-name">${e.name}</div><div class="event-countdown">${e.countdown}</div><div class="event-date">${e.date}</div>`;
    }

    if (allowActions && e.key) {
      contentHTML += `
        <div class="event-actions">
          <button class="event-move-up-btn" title="Move Up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"></path><path d="M5 12l7-7 7 7"></path></svg></button>
          <button class="event-move-down-btn" title="Move Down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M19 12l-7 7-7-7"></path></svg></button>
          <button class="event-edit-btn" title="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"></path></svg></button>
          <button class="event-delete-btn" title="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg></button>
        </div>`;
    }

    item.innerHTML = contentHTML;

    if (allowActions && e.key) {
      const actionsEl = item.querySelector(".event-actions");
      actionsEl.addEventListener("click", (ev) => ev.stopPropagation());
      const upBtn = item.querySelector(".event-move-up-btn");
      const downBtn = item.querySelector(".event-move-down-btn");
      if (idx === 0) { upBtn.disabled = true; upBtn.classList.add("event-action-disabled"); }
      if (idx === events.length - 1) { downBtn.disabled = true; downBtn.classList.add("event-action-disabled"); }
      upBtn.addEventListener("click", () => moveReminder(e.key, -1));
      downBtn.addEventListener("click", () => moveReminder(e.key, 1));
      item.querySelector(".event-edit-btn").addEventListener("click", () => openEditReminder(e.key));
      item.querySelector(".event-delete-btn").addEventListener("click", () => deleteReminder(e.key, e.name));
      attachLongPress(item, () => toggleItemActions(item, e.key));
    }

    container.appendChild(item);
  });
}

let latestRawEvents = [];

function getSortedEvents() {
  return latestRawEvents
    .map((ev, idx) => ({ ...ev, order: (ev.order !== undefined && ev.order !== null) ? ev.order : idx }))
    .sort((a, b) => a.order - b.order);
}

function moveReminder(key, direction) {
  const sorted = getSortedEvents();
  const idx = sorted.findIndex((ev) => ev.key === key);
  if (idx === -1) return;
  const targetIdx = idx + direction;
  if (targetIdx < 0 || targetIdx >= sorted.length) return;
  const temp = sorted[idx];
  sorted[idx] = sorted[targetIdx];
  sorted[targetIdx] = temp;
  const updates = {};
  sorted.forEach((ev, i) => { updates[ev.key + "/order"] = i; });
  eventsRef.update(updates);
}

function renderAll() {
  const listAlerts = document.getElementById("list-alerts");
  const listData = document.getElementById("list-data");
  const headerText = getHeaderText();
  const headerLabel = getLabelValue("header", headerText);

  document.getElementById("header-alerts-left").textContent = headerLabel;
  document.getElementById("header-data-left").textContent = headerLabel;

  const events = getSortedEvents()
    .map((ev) => buildEventDisplay(ev.name, ev.date, ev.type, ev.alertDays, ev.key))
    .filter(Boolean);

  document.getElementById("header-data-right").textContent = getLabelValue("listCount", events.length + ".Reminder List");
  const alertTitleEl = document.getElementById("alertTitleText");
  if (alertTitleEl) alertTitleEl.textContent = getLabelValue("alertTitle", "Alert");

  if (events.length === 0) {
    listData.innerHTML = '<div class="refreshing-state">Refreshing <span class="dots-bold">. . .</span></div>';
  } else {
    renderEvents(listData, events, true);
  }

  const alerts = events.filter((e) => e.isAlert);
  if (alerts.length === 0) listAlerts.innerHTML = '<div class="refreshing-state">Refreshing <span class="dots-bold">. . .</span></div>';
  else renderEvents(listAlerts, alerts, false);
}

function loadAll() {
  renderAll();
}

if (eventsRef) {
  eventsRef.on("value", (snapshot) => {
    const val = snapshot.val();
    const raw = [];
    if (val) {
      Object.keys(val).forEach((key) => {
        const ev = val[key];
        if (!ev || !ev.name || !ev.date) return;
        raw.push({ name: ev.name, date: ev.date, type: ev.type, alertDays: ev.alertDays, key: key, order: ev.order });
      });
    }
    latestRawEvents = raw;
    renderAll();
  }, (error) => {
    const msg = '<div class="empty-state">Could not load data. Please try again later.</div>';
    document.getElementById("list-alerts").innerHTML = msg;
    document.getElementById("list-data").innerHTML = msg;
  });
} else {
  const msg = '<div class="empty-state">Could not load data. Please try again later.</div>';
  document.getElementById("list-alerts").innerHTML = msg;
  document.getElementById("list-data").innerHTML = msg;
}

let editingReminderKey = null;

function openAddReminder() {
  editingReminderKey = null;
  document.getElementById("addReminderTitle").textContent = "Add New List";
  document.getElementById("addReminderSaveBtn").textContent = "Save New List";
  document.getElementById("new-list-name").value = "";
  document.getElementById("new-target-date").value = "";
  document.getElementById("new-alert-day").value = ALERT_THRESHOLD_DAYS;
  document.querySelector('input[name="new-type"][value="countdown"]').checked = true;
  document.getElementById("addReminderOverlay").classList.add("open");
}

function openEditReminder(key) {
  const ev = latestRawEvents.find((it) => it.key === key);
  if (!ev) return;
  hideAllActions();
  editingReminderKey = key;
  document.getElementById("addReminderTitle").textContent = "Edit List";
  document.getElementById("addReminderSaveBtn").textContent = "Update List";
  document.getElementById("new-list-name").value = ev.name;
  document.getElementById("new-target-date").value = ev.date || "";
  document.getElementById("new-alert-day").value = (ev.alertDays !== undefined && ev.alertDays !== null) ? ev.alertDays : ALERT_THRESHOLD_DAYS;
  const type = (ev.type || "countdown").toLowerCase();
  const typeInput = document.querySelector(`input[name="new-type"][value="${type}"]`);
  if (typeInput) typeInput.checked = true;
  document.getElementById("addReminderOverlay").classList.add("open");
}

function deleteReminder(key, name) {
  hideAllActions();
  if (!eventsRef) {
    alert("Firebase connect nahi hai, delete nahi ho payega.");
    return;
  }
  if (!confirm(`Delete "${name}"?`)) return;
  eventsRef.child(key).remove().catch((err) => {
    alert("Delete nahi ho paya: " + err.message);
  });
}

function closeAddReminder() {
  document.getElementById("addReminderOverlay").classList.remove("open");
}

function saveNewReminder() {
  const name = document.getElementById("new-list-name").value.trim();
  const dateVal = document.getElementById("new-target-date").value.trim();
  const alertDayRaw = document.getElementById("new-alert-day").value;
  const alertDay = parseInt(alertDayRaw, 10);
  const type = document.querySelector('input[name="new-type"]:checked').value;

  if (!name || !dateVal) {
    alert("Please fill in the List Name and Target Date.");
    return;
  }
  if (!parseEventDateString(dateVal)) {
    alert("Please enter the Target Date in the correct format: DD/MM/YYYY (e.g. 15/08/2026)");
    return;
  }
  if (!eventsRef) {
    alert("Firebase connect nahi hai, list save nahi ho payegi.");
    return;
  }

  const newEvent = {
    name: name,
    date: dateVal,
    type: type,
    alertDays: isNaN(alertDay) ? ALERT_THRESHOLD_DAYS : alertDay
  };

  let action;
  if (editingReminderKey) {
    action = eventsRef.child(editingReminderKey).update(newEvent);
  } else {
    newEvent.order = getSortedEvents().length;
    action = eventsRef.push(newEvent);
  }

  action
    .then(() => {
      editingReminderKey = null;
      closeAddReminder();
    })
    .catch((err) => {
      alert("Save nahi ho paya: " + err.message);
    });
}

renderAll();
setInterval(renderAll, 60000);

    FONT_OPTIONS.forEach((opt) => {
      const o = document.createElement("option");
      o.value = opt.value;
      o.textContent = opt.label;
      o.style.fontFamily = opt.value;
      sel.appendChild(o);
    });
  });
}
populateFontSelects();

const FONT_TARGETS = ["header", "title", "name", "countdown", "date"];
const DEFAULT_PAGE_SETTINGS = {
  header: { size: 19, color: "#000000", font: "inherit", bold: false },
  title: { size: 26, color: "#b266b2", font: "inherit", bold: true },
  name: { size: 20, color: "#000000", font: "inherit", bold: false },
  countdown: { size: 26, color: "#ff0000", font: "inherit", bold: true },
  date: { size: 15, color: "#000000", font: "inherit", bold: false },
  background: "#ffffff"
};

function cloneDefaults() { return JSON.parse(JSON.stringify(DEFAULT_PAGE_SETTINGS)); }
function defaultLabels() { return { header: { text: null, hidden: false }, listCount: { text: null, hidden: false }, alertTitle: { text: null, hidden: false } }; }
cloudSettings.alerts = cloneDefaults();
cloudSettings.data = cloneDefaults();
function getSavedFontSettings(page) { return cloudSettings[page] || cloneDefaults(); }

function getLabelValue(key, defaultText) {
  const label = (cloudSettings.labels && cloudSettings.labels[key]) || { text: null, hidden: false };
  if (label.hidden) return "";
  return (label.text !== null && label.text !== undefined && label.text !== "") ? label.text : defaultText;
}

function editLabel(key, defaultText) {
  const label = (cloudSettings.labels && cloudSettings.labels[key]) || { text: null, hidden: false };
  const current = label.hidden ? "" : ((label.text !== null && label.text !== undefined) ? label.text : defaultText);
  const val = prompt("Edit text:", current);
  if (val === null) return;
  if (!cloudSettings.labels) cloudSettings.labels = defaultLabels();
  cloudSettings.labels[key] = { text: val, hidden: false };
  saveCloudSettings(cloudSettings);
  renderAll();
  hideAllActions();
}

function deleteLabel(key) {
  if (!confirm("Delete this line?")) return;
  if (!cloudSettings.labels) cloudSettings.labels = defaultLabels();
  cloudSettings.labels[key] = { text: "", hidden: true };
  saveCloudSettings(cloudSettings);
  renderAll();
  hideAllActions();
}

const savedPage = sessionStorage.getItem("activePage");
showPage(savedPage === "data" ? "data" : "alerts");

function applyFontSettingsToContainer(containerId, settings) {
  const container = document.getElementById(containerId);
  FONT_TARGETS.forEach((target) => {
    const s = settings[target] || DEFAULT_PAGE_SETTINGS[target];
    container.style.setProperty(`--${target}-size`, s.size + "px");
    container.style.setProperty(`--${target}-color`, s.color);
    container.style.setProperty(`--${target}-font`, s.font);
    container.style.setProperty(`--${target}-weight`, s.bold ? "700" : "400");
  });
}

function applyPageBackground(page) {
  const settings = getSavedFontSettings(page);
  document.body.style.backgroundColor = settings.background || "#ffffff";
}

function fillSettingsForm(settings) {
  FONT_TARGETS.forEach((target) => {
    const s = settings[target] || DEFAULT_PAGE_SETTINGS[target];
    document.getElementById(`${target}-size`).value = s.size;
    document.getElementById(`${target}-color`).value = s.color;
    document.getElementById(`${target}-font`).value = s.font;
    document.getElementById(`${target}-bold`).checked = !!s.bold;
  });
  document.getElementById("page-bg-color").value = settings.background || "#ffffff";
}

function readSettingsForm() {
  const settings = {};
  FONT_TARGETS.forEach((target) => {
    settings[target] = {
      size: parseInt(document.getElementById(`${target}-size`).value, 10) || DEFAULT_PAGE_SETTINGS[target].size,
      color: document.getElementById(`${target}-color`).value,
      font: document.getElementById(`${target}-font`).value,
      bold: document.getElementById(`${target}-bold`).checked
    };
  });
  settings.background = document.getElementById("page-bg-color").value;
  return settings;
}

let configDrafts = null;
let currentConfigTab = "alerts";

function updateTabUI() {
  document.getElementById("cfgtab-alerts").classList.toggle("active", currentConfigTab === "alerts");
  document.getElementById("cfgtab-data").classList.toggle("active", currentConfigTab === "data");
}

function switchConfigTab(tab) {
  configDrafts[currentConfigTab] = readSettingsForm();
  currentConfigTab = tab;
  updateTabUI();
  fillSettingsForm(configDrafts[currentConfigTab]);
}

function openSettings() {
  configDrafts = {
    alerts: JSON.parse(JSON.stringify(getSavedFontSettings("alerts"))),
    data: JSON.parse(JSON.stringify(getSavedFontSettings("data")))
  };
  currentConfigTab = getActivePageName();
  updateTabUI();
  fillSettingsForm(configDrafts[currentConfigTab]);
  document.getElementById("settingsOverlay").classList.add("open");
}

function closeSettings() {
  document.getElementById("settingsOverlay").classList.remove("open");
}

function openAnimationPage() {
  document.getElementById("animationOverlay").classList.add("open");
}

function closeAnimationPage() {
  document.getElementById("animationOverlay").classList.remove("open");
}

async function applySettings() {
  configDrafts[currentConfigTab] = readSettingsForm();
  cloudSettings.alerts = configDrafts.alerts;
  cloudSettings.data = configDrafts.data;
  applyFontSettingsToContainer("page-alerts", cloudSettings.alerts);
  applyFontSettingsToContainer("page-data", cloudSettings.data);
  applyPageBackground(getActivePageName());
  loadAll();
  setSyncStatus("Saving...");
  try {
    await saveCloudSettings(cloudSettings);
    setSyncStatus("Synced");
  } catch (err) {
    setSyncStatus("Sync failed");
  }
  closeSettings();
}

function resetSettings() {
  const defaults = cloneDefaults();
  configDrafts[currentConfigTab] = defaults;
  fillSettingsForm(defaults);
}

if (settingsRef) {
  settingsRef.on("value", (snapshot) => {
    const val = snapshot.val();
    if (val) {
      if (val.alerts) cloudSettings.alerts = val.alerts;
      if (val.data) cloudSettings.data = val.data;
      if (val.labels) cloudSettings.labels = val.labels;
      if (val.thresholds) {
        cloudSettings.thresholds = val.thresholds;
        ALERT_THRESHOLD_DAYS = val.thresholds.days || ALERT_THRESHOLD_DAYS;
        CYLINDER_THRESHOLD_VALUE = (val.thresholds.cylinder !== undefined) ? val.thresholds.cylinder : CYLINDER_THRESHOLD_VALUE;
      }
      applyFontSettingsToContainer("page-alerts", cloudSettings.alerts);
      applyFontSettingsToContainer("page-data", cloudSettings.data);
      applyPageBackground(getActivePageName());
      loadAll();
      setSyncStatus("Synced");
    } else {
      setSyncStatus("");
    }
  }, (error) => {
    setSyncStatus("Sync error");
  });
} else {
  setSyncStatus("Offline");
}

// Auto-update checker: detects new deployment and reloads automatically, no manual refresh needed
(function(){
  let baselineHTML = null;
  async function checkForUpdate(){
    try{
      const res = await fetch(location.pathname + "?_=" + Date.now(), { cache: "no-store" });
      const text = await res.text();
      if(baselineHTML === null){
        baselineHTML = text;
        return;
      }
      if(text !== baselineHTML){
        location.reload();
      }
    }catch(e){}
  }
  checkForUpdate();
  setInterval(checkForUpdate, 3000);
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden){
      checkForUpdate();
    }
  });
  window.addEventListener("focus", checkForUpdate);
})();
</script>
