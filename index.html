<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reminders - Live</title>
<style>
  /* आपकी पुरानी स्टाइलिंग यहाँ है */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #ffffff; color: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 70px 20px 80px; max-width: 640px; margin: 0 auto;
  }
  .header-date { 
    position: fixed; top: 0; left: 0; right: 0; background: #fff; z-index: 20;
    padding: 8px 20px; border-bottom: 2px solid #d40000; display: flex; 
    justify-content: space-between; max-width: 640px; margin: 0 auto;
    font-size: 19px;
  }
  .event { margin-bottom: 25px; text-align: left; }
  .event-name { font-size: 20px; font-weight: 400; color: #000; margin-bottom: 2px; }
  .event-countdown { font-size: 26px; font-weight: 700; color: #ff0000; margin-bottom: 2px; }
  .event-date { font-size: 15px; color: #000; }
  .alerts-page-title { text-align: center; color: #ff0000; font-size: 26px; font-weight: 700; margin-top: -30px; margin-bottom: 20px; }
  .page { display: none; }
  .page.active { display: block; }
  .page-toggle-btn, .settings-icon { 
    position: fixed; right: 0; width: 38px; height: 38px; 
    background: transparent; color: #b9b7b5; border: none; font-size: 22px; cursor: pointer; z-index: 15;
  }
  .page-toggle-btn { top: 50%; transform: translateY(-144px); }
  .settings-icon { top: 50%; transform: translateY(-48px); }
  .sync-status { position: fixed; top: 45px; left: 20px; font-size: 11px; color: #d40000; font-weight: bold; }
</style>
</head>
<body>

<div id="syncStatus" class="sync-status">Live</div>
<button class="page-toggle-btn" onclick="togglePage()">⇄</button>
<button class="settings-icon">⚙</button>

<!-- ALERT PAGE -->
<div id="page-alerts" class="page active">
  <div class="header-date"><span id="h-alerts-left">Loading...</span></div>
  <div class="alerts-page-title">Alert</div>
  <div id="list-alerts"></div>
</div>

<!-- LIST PAGE -->
<div id="page-data" class="page">
  <div class="header-date"><span id="h-list-left">Loading...</span><span id="h-list-right"></span></div>
  <div id="list-data"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAynuPWAbwu6etjBTqBejpppw4S4umoKPM",
  authDomain: "my-tracker-d4776.firebaseapp.com",
  databaseURL: "https://my-tracker-d4776-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "my-tracker-d4776",
  storageBucket: "my-tracker-d4776.firebasestorage.app",
  messagingSenderId: "207196018290",
  appId: "1:207196018290:web:e544ccd2eac3e84150d4eb"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let ALERT_THRESHOLD = 15; // 15 दिन से कम होने पर अलर्ट

function togglePage() {
  const p1 = document.getElementById('page-alerts');
  const p2 = document.getElementById('page-data');
  p1.classList.toggle('active');
  p2.classList.toggle('active');
}

// मुख्य फंक्शन: डेटा लोड करना
db.ref("remindersData").on("value", (snapshot) => {
  const data = snapshot.val();
  const listAlerts = document.getElementById("list-alerts");
  const listData = document.getElementById("list-data");
  
  listAlerts.innerHTML = "";
  listData.innerHTML = "";

  let totalCount = 0;
  const today = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
  document.getElementById("h-alerts-left").innerText = "Today - " + today;
  document.getElementById("h-list-left").innerText = "Today - " + today;

  if (data) {
    Object.values(data).forEach((item) => {
      totalCount++;
      
      // HTML स्ट्रक्चर (3 लाइन वाला)
      const eventHtml = `
        <div class="event">
          <div class="event-name">${item.name}</div>
          <div class="event-countdown">${item.countdown}</div>
          <div class="event-date">${item.date}</div>
        </div>
      `;

      // 1. लिस्ट पेज में सब कुछ जोड़ें
      listData.innerHTML += eventHtml;

      // 2. अलर्ट पेज के लिए लॉजिक (सिर्फ "X . Day Left" में से नंबर निकालें)
      const dayMatch = item.countdown.match(/(\d+)/);
      if (dayMatch) {
        const daysLeft = parseInt(dayMatch[1]);
        if (daysLeft <= ALERT_THRESHOLD) {
          listAlerts.innerHTML += eventHtml;
        }
      }
    });
  }

  document.getElementById("h-list-right").innerText = "Reminders List: " + totalCount;
  if (listAlerts.innerHTML === "") {
    listAlerts.innerHTML = '<div style="text-align:center; color:#666;">No alerts right now.</div>';
  }
});
</script>
</body>
</html>
