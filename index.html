<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reminders</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: #ffffff;
    color: #000000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    padding: 70px 20px 80px;
    max-width: 640px;
    margin: 0 auto;
  }

  .header-date {
    font-size: var(--header-size, 19px);
    color: var(--header-color, #000000);
    font-family: var(--header-font, inherit);
    font-weight: var(--header-weight, 400);
    margin-bottom: 28px;
  }

  .event {
    margin-bottom: 22px;
  }

  .event-name {
    color: var(--name-color, #000000);
    font-size: var(--name-size, 20px);
    font-family: var(--name-font, inherit);
    font-weight: var(--name-weight, 400);
    margin-bottom: 4px;
  }

  .event-countdown {
    color: var(--countdown-color, #ff0000);
    font-size: var(--countdown-size, 26px);
    font-family: var(--countdown-font, inherit);
    font-weight: var(--countdown-weight, 700);
    margin-bottom: 2px;
  }

  .event-date {
    color: var(--date-color, #000000);
    font-size: var(--date-size, 15px);
    font-family: var(--date-font, inherit);
    font-weight: var(--date-weight, 400);
  }

  #page-alerts .header-date {
    text-align: center;
  }

  #list-alerts {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #list-alerts .event {
    text-align: left;
  }

  .empty-state {
    color: #555;
    font-size: 16px;
    margin-top: 12px;
  }

  .loading {
    color: #555;
  }

  .page {
    display: none;
  }

  .page.active {
    display: block;
  }

  .page-toggle-btn {
    position: fixed;
    top: 18px;
    right: 0;
    background: #000000;
    color: #ffffff;
    border: none;
    padding: 10px 20px 10px 22px;
    border-radius: 24px 0 0 24px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    z-index: 15;
  }

  .settings-icon {
    position: fixed;
    bottom: 16px;
    right: 16px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #ffffff;
    color: #e6e6e6;
    border: 1px solid #f0f0f0;
    font-size: 17px;
    cursor: pointer;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .settings-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 30;
    align-items: flex-end;
    justify-content: center;
  }

  .settings-overlay.open {
    display: flex;
  }

  .settings-panel {
    background: #ffffff;
    width: 100%;
    max-width: 640px;
    max-height: 85vh;
    overflow-y: auto;
    border-radius: 16px 16px 0 0;
    padding: 20px;
  }

  .settings-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
  }

  .settings-title button {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: #000000;
  }

  .settings-page-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .cfgtab {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ddd;
    background: #f5f5f5;
    color: #000;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .cfgtab.active {
    background: #d40000;
    color: #ffffff;
    border-color: #d40000;
  }

  .settings-row {
    border-top: 1px solid #eee;
    padding: 14px 0;
  }

  .settings-row-label {
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 10px;
  }

  .settings-controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  .settings-controls label {
    font-size: 12px;
    color: #555;
    display: block;
    margin-bottom: 2px;
  }

  .settings-field {
    display: flex;
    flex-direction: column;
  }

  .settings-field input[type="number"] {
    width: 64px;
    padding: 6px;
    border: 1px solid #ccc;
    border-radius: 6px;
  }

  .settings-field select {
    padding: 6px;
    border: 1px solid #ccc;
    border-radius: 6px;
    max-width: 140px;
  }

  .color-combo {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .color-combo input[type="color"] {
    width: 34px;
    height: 34px;
    padding: 0;
    border: 1px solid #ccc;
    border-radius: 6px;
  }

  .multicolor-swatch {
    width: 34px;
    height: 34px;
    border-radius: 6px;
    border: 1px solid #999;
    cursor: pointer;
    display: inline-block;
    background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
  }

  .settings-field-bold {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .settings-field-bold input[type="checkbox"] {
    width: 20px;
    height: 20px;
    margin-top: 4px;
  }

  .settings-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }

  .settings-actions button {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-weight: 700;
    cursor: pointer;
  }

  .settings-apply {
    background: #d40000;
    color: #ffffff;
  }

  .settings-reset {
    background: #eee;
    color: #000000;
  }
</style>
</head>
<body>

<button id="pageToggleBtn" class="page-toggle-btn" onclick="togglePage()">List</button>
<button class="settings-icon" onclick="openSettings()" title="Settings">⚙</button>

<div id="settingsOverlay" class="settings-overlay">
  <div class="settings-panel">
    <div class="settings-title">
      <span>Settings</span>
      <button onclick="closeSettings()">✕</button>
    </div>

    <div class="settings-page-tabs">
      <button id="cfgtab-alerts" class="cfgtab active" onclick="switchConfigTab('alerts')">Alerts Page</button>
      <button id="cfgtab-data" class="cfgtab" onclick="switchConfigTab('data')">List Page</button>
    </div>

    <div class="settings-row">
      <div class="settings-row-label">Page Background</div>
      <div class="settings-controls">
        <div class="settings-field">
          <label>Color</label>
          <div class="color-combo">
            <input type="color" id="page-bg-color">
            <label for="page-bg-color" class="multicolor-swatch" title="Choose any color"></label>
          </div>
        </div>
      </div>
    </div>

    <div class="settings-row">
      <div class="settings-row-label">Date Header (Today - ...)</div>
      <div class="settings-controls">
        <div class="settings-field">
          <label>Size</label>
          <input type="number" id="header-size" min="8" max="60">
        </div>
        <div class="settings-field">
          <label>Color</label>
          <div class="color-combo">
            <input type="color" id="header-color">
            <label for="header-color" class="multicolor-swatch" title="Choose any color"></label>
          </div>
        </div>
        <div class="settings-field">
          <label>Style</label>
          <select id="header-font"></select>
        </div>
        <div class="settings-field-bold">
          <label>Bold</label>
          <input type="checkbox" id="header-bold">
        </div>
      </div>
    </div>

    <div class="settings-row">
      <div class="settings-row-label">Name (e.g. V! Recharge)</div>
      <div class="settings-controls">
        <div class="settings-field">
          <label>Size</label>
          <input type="number" id="name-size" min="8" max="60">
        </div>
        <div class="settings-field">
          <label>Color</label>
          <div class="color-combo">
            <input type="color" id="name-color">
            <label for="name-color" class="multicolor-swatch" title="Choose any color"></label>
          </div>
        </div>
        <div class="settings-field">
          <label>Style</label>
          <select id="name-font"></select>
        </div>
        <div class="settings-field-bold">
          <label>Bold</label>
          <input type="checkbox" id="name-bold">
        </div>
      </div>
    </div>

    <div class="settings-row">
      <div class="settings-row-label">Day Left (red line)</div>
      <div class="settings-controls">
        <div class="settings-field">
          <label>Size</label>
          <input type="number" id="countdown-size" min="8" max="60">
        </div>
        <div class="settings-field">
          <label>Color</label>
          <div class="color-combo">
            <input type="color" id="countdown-color">
            <label for="countdown-color" class="multicolor-swatch" title="Choose any color"></label>
          </div>
        </div>
        <div class="settings-field">
          <label>Style</label>
          <select id="countdown-font"></select>
        </div>
        <div class="settings-field-bold">
          <label>Bold</label>
          <input type="checkbox" id="countdown-bold">
        </div>
      </div>
    </div>

    <div class="settings-row">
      <div class="settings-row-label">Date</div>
      <div class="settings-controls">
        <div class="settings-field">
          <label>Size</label>
          <input type="number" id="date-size" min="8" max="60">
        </div>
        <div class="settings-field">
          <label>Color</label>
          <div class="color-combo">
            <input type="color" id="date-color">
            <label for="date-color" class="multicolor-swatch" title="Choose any color"></label>
          </div>
        </div>
        <div class="settings-field">
          <label>Style</label>
          <select id="date-font"></select>
        </div>
        <div class="settings-field-bold">
          <label>Bold</label>
          <input type="checkbox" id="date-bold">
        </div>
      </div>
    </div>

    <div class="settings-actions">
      <button class="settings-reset" onclick="resetSettings()">Reset (this page)</button>
      <button class="settings-apply" onclick="applySettings()">Apply</button>
    </div>
  </div>
</div>

<!-- PAGE 1: Alerts -->
<div id="page-alerts" class="page active">
  <div id="header-alerts" class="header-date"></div>
  <div id="list-alerts"><div class="loading">Loading...</div></div>
</div>

<!-- PAGE 2: All Data -->
<div id="page-data" class="page">
  <div id="header-data" class="header-date"></div>
  <div id="list-data"><div class="loading">Loading...</div></div>
</div>

<script>
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQhnQJrsY7BIuA3h5iMxaU3-yr3J9skyPtSSL_YoQfmYYQYXfPFnGWDH1loxyXC3mtl9-PS-oLa5_0n/pub?output=csv";
const ALERT_THRESHOLD_DAYS = 15;
const CYLINDER_THRESHOLD_MONTHS = 3;

function getActivePageName() {
  return document.getElementById("page-alerts").classList.contains("active") ? "alerts" : "data";
}

function showPage(name) {
  document.getElementById("page-alerts").classList.toggle("active", name === "alerts");
  document.getElementById("page-data").classList.toggle("active", name === "data");
  document.getElementById("pageToggleBtn").textContent = name === "alerts" ? "List" : "Alerts";
  localStorage.setItem("activePage", name);
  applyPageBackground(name);
}

function togglePage() {
  const next = getActivePageName() === "alerts" ? "data" : "alerts";
  showPage(next);
}

const savedPage = localStorage.getItem("activePage");
showPage(savedPage === "data" ? "data" : "alerts");

function parseSheetCSV(csvText) {
  const rawLines = csvText.split("\n");

  const values = rawLines.map((line) => {
    const idx = line.indexOf(",");
    const col = idx === -1 ? "" : line.slice(idx + 1);
    return col.replace(/\r/g, "").trim();
  });

  const nonEmpty = values.filter((v) => v.length > 0);
  if (nonEmpty.length === 0) {
    return { header: "", events: [] };
  }

  const header = nonEmpty[0];
  const rest = nonEmpty.slice(1);

  const events = [];
  for (let i = 0; i < rest.length; i += 3) {
    const name = rest[i];
    const countdown = rest[i + 1];
    const date = rest[i + 2];
    if (!name || !countdown) continue;

    const dayMatch = countdown.match(/^(\d+)\s*\.\s*Day Left/i);
    const monthMatch = countdown.match(/^(\d+)\s*\.\s*Months\s*-\s*(\d+)\s*\.\s*Days/i);

    let days = null;
    let isDayFormat = false;
    let isMonthFormat = false;
    let monthsElapsed = null;
    let daysElapsed = null;

    if (dayMatch) {
      days = parseInt(dayMatch[1], 10);
      isDayFormat = true;
    } else if (monthMatch) {
      monthsElapsed = parseInt(monthMatch[1], 10);
      daysElapsed = parseInt(monthMatch[2], 10);
      isMonthFormat = true;
    }

    events.push({ name, countdown, date, days, isDayFormat, isMonthFormat, monthsElapsed, daysElapsed });
  }

  return { header, events };
}

async function fetchSheetData() {
  const response = await fetch(SHEET_CSV_URL, { cache: "no-store" });
  if (!response.ok) throw new Error("Network response was not ok");
  const text = await response.text();
  return parseSheetCSV(text);
}

function renderEvents(container, events) {
  container.innerHTML = "";
  events.forEach((e) => {
    const item = document.createElement("div");
    item.className = "event";
    item.innerHTML = `
      <div class="event-name">${e.name}</div>
      <div class="event-countdown">${e.countdown}</div>
      <div class="event-date">${e.date}</div>
    `;
    container.appendChild(item);
  });
}

async function loadAll() {
  const headerAlerts = document.getElementById("header-alerts");
  const listAlerts = document.getElementById("list-alerts");
  const headerData = document.getElementById("header-data");
  const listData = document.getElementById("list-data");

  try {
    const { header, events } = await fetchSheetData();

    headerAlerts.textContent = header;
    headerData.textContent = header;

    renderEvents(listData, events);

    const alerts = events.filter((e) => {
      if (e.isDayFormat && e.days !== null) {
        return e.days <= ALERT_THRESHOLD_DAYS;
      }
      if (e.isMonthFormat && e.monthsElapsed !== null) {
        return e.monthsElapsed >= CYLINDER_THRESHOLD_MONTHS;
      }
      return false;
    });

    if (alerts.length === 0) {
      listAlerts.innerHTML = '<div class="empty-state">No alerts right now.</div>';
    } else {
      renderEvents(listAlerts, alerts);
    }
  } catch (err) {
    const msg = '<div class="empty-state">Could not load data. Please try again later.</div>';
    listAlerts.innerHTML = msg;
    listData.innerHTML = msg;
  }
}

loadAll();
setInterval(loadAll, 3000);

const FONT_OPTIONS = [
  { label: "Default", value: "inherit" },
  { label: "Arial", value: "Arial, sans-serif" },
  { label: "Helvetica", value: "Helvetica, Arial, sans-serif" },
  { label: "Verdana", value: "Verdana, sans-serif" },
  { label: "Tahoma", value: "Tahoma, sans-serif" },
  { label: "Trebuchet MS", value: "'Trebuchet MS', sans-serif" },
  { label: "Segoe UI", value: "'Segoe UI', sans-serif" },
  { label: "Calibri", value: "Calibri, sans-serif" },
  { label: "Century Gothic", value: "'Century Gothic', sans-serif" },
  { label: "Franklin Gothic", value: "'Franklin Gothic Medium', sans-serif" },
  { label: "Arial Black", value: "'Arial Black', sans-serif" },
  { label: "Georgia", value: "Georgia, serif" },
  { label: "Times New Roman", value: "'Times New Roman', serif" },
  { label: "Garamond", value: "Garamond, serif" },
  { label: "Palatino", value: "'Palatino Linotype', serif" },
  { label: "Book Antiqua", value: "'Book Antiqua', serif" },
  { label: "Cambria", value: "Cambria, serif" },
  { label: "Courier New", value: "'Courier New', monospace" },
  { label: "Lucida Console", value: "'Lucida Console', monospace" },
  { label: "Consolas", value: "Consolas, monospace" }
];

function populateFontSelects() {
  ["header-font", "name-font", "countdown-font", "date-font"].forEach((id) => {
    const sel = document.getElementById(id);
    sel.innerHTML = "";
    FONT_OPTIONS.forEach((opt) => {
      const o = document.createElement("option");
      o.value = opt.value;
      o.textContent = opt.label;
      sel.appendChild(o);
    });
  });
}
populateFontSelects();

const FONT_TARGETS = ["header", "name", "countdown", "date"];

const DEFAULT_PAGE_SETTINGS = {
  header:     { size: 19, color: "#000000", font: "inherit", bold: false },
  name:       { size: 20, color: "#000000", font: "inherit", bold: false },
  countdown:  { size: 26, color: "#ff0000", font: "inherit", bold: true  },
  date:       { size: 15, color: "#000000", font: "inherit", bold: false },
  background: "#ffffff"
};

function cloneDefaults() {
  return JSON.parse(JSON.stringify(DEFAULT_PAGE_SETTINGS));
}

function getSavedFontSettings(page) {
  try {
    const raw = localStorage.getItem(`fontSettings_${page}`);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) {
    return null;
  }
}

function applyFontSettingsToContainer(containerId, settings) {
  const container = document.getElementById(containerId);
  FONT_TARGETS.forEach((target) => {
    const s = settings[target] || DEFAULT_PAGE_SETTINGS[target];
    container.style.setProperty(`--${target}-size`, s.size + "px");
    container.style.setProperty(`--${target}-color`, s.color);
    container.style.setProperty(`--${target}-font`, s.font);
    container.style.setProperty(`--${target}-weight`, s.bold ? "700" : "400");
  });
}

function applyPageBackground(page) {
  const settings = getSavedFontSettings(page) || cloneDefaults();
  document.body.style.backgroundColor = settings.background || "#ffffff";
}

function fillSettingsForm(settings) {
  FONT_TARGETS.forEach((target) => {
    const s = settings[target] || DEFAULT_PAGE_SETTINGS[target];
    document.getElementById(`${target}-size`).value = s.size;
    document.getElementById(`${target}-color`).value = s.color;
    document.getElementById(`${target}-font`).value = s.font;
    document.getElementById(`${target}-bold`).checked = !!s.bold;
  });
  document.getElementById("page-bg-color").value = settings.background || "#ffffff";
}

function readSettingsForm() {
  const settings = {};
  FONT_TARGETS.forEach((target) => {
    settings[target] = {
      size: parseInt(document.getElementById(`${target}-size`).value, 10) || DEFAULT_PAGE_SETTINGS[target].size,
      color: document.getElementById(`${target}-color`).value,
      font: document.getElementById(`${target}-font`).value,
      bold: document.getElementById(`${target}-bold`).checked
    };
  });
  settings.background = document.getElementById("page-bg-color").value;
  return settings;
}

let configDrafts = null;
let currentConfigTab = "alerts";

function updateTabUI() {
  document.getElementById("cfgtab-alerts").classList.toggle("active", currentConfigTab === "alerts");
  document.getElementById("cfgtab-data").classList.toggle("active", currentConfigTab === "data");
}

function switchConfigTab(tab) {
  configDrafts[currentConfigTab] = readSettingsForm();
  currentConfigTab = tab;
  updateTabUI();
  fillSettingsForm(configDrafts[currentConfigTab]);
}

function openSettings() {
  configDrafts = {
    alerts: getSavedFontSettings("alerts") || cloneDefaults(),
    data: getSavedFontSettings("data") || cloneDefaults()
  };
  currentConfigTab = "alerts";
  updateTabUI();
  fillSettingsForm(configDrafts.alerts);
  document.getElementById("settingsOverlay").classList.add("open");
}

function closeSettings() {
  document.getElementById("settingsOverlay").classList.remove("open");
}

function applySettings() {
  configDrafts[currentConfigTab] = readSettingsForm();

  localStorage.setItem("fontSettings_alerts", JSON.stringify(configDrafts.alerts));
  localStorage.setItem("fontSettings_data", JSON.stringify(configDrafts.data));

  applyFontSettingsToContainer("page-alerts", configDrafts.alerts);
  applyFontSettingsToContainer("page-data", configDrafts.data);
  applyPageBackground(getActivePageName());

  closeSettings();
}

function resetSettings() {
  const defaults = cloneDefaults();
  configDrafts[current
