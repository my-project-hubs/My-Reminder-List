<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reminders</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --header-size: 19px;
    --header-color: #000000;
    --header-font: inherit;

    --name-size: 20px;
    --name-color: #000000;
    --name-font: inherit;

    --countdown-size: 26px;
    --countdown-color: #ff0000;
    --countdown-font: inherit;

    --date-size: 15px;
    --date-color: #000000;
    --date-font: inherit;
  }

  body {
    background: #ffffff;
    color: #000000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    padding: 24px 20px 60px;
    max-width: 640px;
    margin: 0 auto;
  }

  .nav {
    display: flex;
    justify-content: flex-end;
    gap: 20px;
    margin-bottom: 24px;
    font-size: 15px;
  }

  .nav button {
    background: none;
    border: none;
    color: #000000;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    padding: 0 0 4px 0;
    border-bottom: 2px solid transparent;
  }

  .nav button.active {
    border-bottom: 2px solid #d40000;
    font-weight: 600;
  }

  .header-date {
    font-size: var(--header-size);
    color: var(--header-color);
    font-family: var(--header-font);
    font-weight: 400;
    margin-bottom: 28px;
  }

  .event {
    margin-bottom: 22px;
  }

  .event-name {
    color: var(--name-color);
    font-size: var(--name-size);
    font-family: var(--name-font);
    margin-bottom: 4px;
  }

  .event-countdown {
    color: var(--countdown-color);
    font-weight: 700;
    font-size: var(--countdown-size);
    font-family: var(--countdown-font);
    margin-bottom: 2px;
  }

  .event-date {
    color: var(--date-color);
    font-size: var(--date-size);
    font-family: var(--date-font);
  }

  #page-alerts .header-date {
    text-align: center;
  }

  #list-alerts {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #list-alerts .event {
    text-align: left;
  }

  .empty-state {
    color: #555;
    font-size: 16px;
    margin-top: 12px;
  }

  .loading {
    color: #555;
  }

  .page {
    display: none;
  }

  .page.active {
    display: block;
  }

  .settings-icon {
    position: fixed;
    top: 16px;
    left: 16px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #000000;
    color: #ffffff;
    border: none;
    font-size: 18px;
    cursor: pointer;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .settings-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 30;
    align-items: flex-end;
    justify-content: center;
  }

  .settings-overlay.open {
    display: flex;
  }

  .settings-panel {
    background: #ffffff;
    width: 100%;
    max-width: 640px;
    max-height: 85vh;
    overflow-y: auto;
    border-radius: 16px 16px 0 0;
    padding: 20px;
  }

  .settings-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
  }

  .settings-title button {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: #000000;
  }

  .settings-row {
    border-top: 1px solid #eee;
    padding: 14px 0;
  }

  .settings-row-label {
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 10px;
  }

  .settings-controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  .settings-controls label {
    font-size: 12px;
    color: #555;
    display: block;
    margin-bottom: 2px;
  }

  .settings-field {
    display: flex;
    flex-direction: column;
  }

  .settings-field input[type="number"] {
    width: 64px;
    padding: 6px;
    border: 1px solid #ccc;
    border-radius: 6px;
  }

  .settings-field input[type="color"] {
    width: 44px;
    height: 34px;
    padding: 0;
    border: 1px solid #ccc;
    border-radius: 6px;
  }

  .settings-field select {
    padding: 6px;
    border: 1px solid #ccc;
    border-radius: 6px;
    max-width: 130px;
  }

  .settings-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }

  .settings-actions button {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-weight: 700;
    cursor: pointer;
  }

  .settings-apply {
    background: #d40000;
    color: #ffffff;
  }

  .settings-reset {
    background: #eee;
    color: #000000;
  }
</style>
</head>
<body>

<button class="settings-icon" onclick="openSettings()" title="Settings">⚙</button>

<div id="settingsOverlay" class="settings-overlay">
  <div class="settings-panel">
    <div class="settings-title">
      <span>Settings</span>
      <button onclick="closeSettings()">✕</button>
    </div>

    <div class="settings-row">
      <div class="settings-row-label">Date Header (Today - ...)</div>
      <div class="settings-controls">
        <div class="settings-field">
          <label>Size</label>
          <input type="number" id="header-size" min="8" max="60">
        </div>
        <div class="settings-field">
          <label>Color</label>
          <input type="color" id="header-color">
        </div>
        <div class="settings-field">
          <label>Style</label>
          <select id="header-font">
            <option value="inherit">Default</option>
            <option value="Georgia, serif">Serif</option>
            <option value="'Courier New', monospace">Monospace</option>
            <option value="'Arial Black', sans-serif">Bold Sans</option>
            <option value="Verdana, sans-serif">Rounded</option>
          </select>
        </div>
      </div>
    </div>

    <div class="settings-row">
      <div class="settings-row-label">Name (e.g. V! Recharge)</div>
      <div class="settings-controls">
        <div class="settings-field">
          <label>Size</label>
          <input type="number" id="name-size" min="8" max="60">
        </div>
        <div class="settings-field">
          <label>Color</label>
          <input type="color" id="name-color">
        </div>
        <div class="settings-field">
          <label>Style</label>
          <select id="name-font">
            <option value="inherit">Default</option>
            <option value="Georgia, serif">Serif</option>
            <option value="'Courier New', monospace">Monospace</option>
            <option value="'Arial Black', sans-serif">Bold Sans</option>
            <option value="Verdana, sans-serif">Rounded</option>
          </select>
        </div>
      </div>
    </div>

    <div class="settings-row">
      <div class="settings-row-label">Day Left (red line)</div>
      <div class="settings-controls">
        <div class="settings-field">
          <label>Size</label>
          <input type="number" id="countdown-size" min="8" max="60">
        </div>
        <div class="settings-field">
          <label>Color</label>
          <input type="color" id="countdown-color">
        </div>
        <div class="settings-field">
          <label>Style</label>
          <select id="countdown-font">
            <option value="inherit">Default</option>
            <option value="Georgia, serif">Serif</option>
            <option value="'Courier New', monospace">Monospace</option>
            <option value="'Arial Black', sans-serif">Bold Sans</option>
            <option value="Verdana, sans-serif">Rounded</option>
          </select>
        </div>
      </div>
    </div>

    <div class="settings-row">
      <div class="settings-row-label">Date</div>
      <div class="settings-controls">
        <div class="settings-field">
          <label>Size</label>
          <input type="number" id="date-size" min="8" max="60">
        </div>
        <div class="settings-field">
          <label>Color</label>
          <input type="color" id="date-color">
        </div>
        <div class="settings-field">
          <label>Style</label>
          <select id="date-font">
            <option value="inherit">Default</option>
            <option value="Georgia, serif">Serif</option>
            <option value="'Courier New', monospace">Monospace</option>
            <option value="'Arial Black', sans-serif">Bold Sans</option>
            <option value="Verdana, sans-serif">Rounded</option>
          </select>
        </div>
      </div>
    </div>

    <div class="settings-actions">
      <button class="settings-reset" onclick="resetSettings()">Reset</button>
      <button class="settings-apply" onclick="applySettings()">Apply</button>
    </div>
  </div>
</div>

<div class="nav">
  <button id="tab-alerts" class="active" onclick="showPage('alerts')">Alerts</button>
  <button id="tab-data" onclick="showPage('data')">List</button>
</div>

<!-- PAGE 1: Alerts -->
<div id="page-alerts" class="page active">
  <div id="header-alerts" class="header-date"></div>
  <div id="list-alerts"><div class="loading">Loading...</div></div>
</div>

<!-- PAGE 2: All Data -->
<div id="page-data" class="page">
  <div id="header-data" class="header-date"></div>
  <div id="list-data"><div class="loading">Loading...</div></div>
</div>

<script>
// ============================================================
// SETTINGS - agar aage Google Sheet ka link badalna ho to yahan
// ============================================================
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQhnQJrsY7BIuA3h5iMxaU3-yr3J9skyPtSSL_YoQfmYYQYXfPFnGWDH1loxyXC3mtl9-PS-oLa5_0n/pub?output=csv";
const ALERT_THRESHOLD_DAYS = 15;
const CYLINDER_THRESHOLD_MONTHS = 3;

// ============================================================
// Tab switching
// ============================================================
function showPage(name) {
  document.getElementById("page-alerts").classList.toggle("active", name === "alerts");
  document.getElementById("page-data").classList.toggle("active", name === "data");
  document.getElementById("tab-alerts").classList.toggle("active", name === "alerts");
  document.getElementById("tab-data").classList.toggle("active", name === "data");
  localStorage.setItem("activePage", name);
}

// Restore the page the user was on before refresh
const savedPage = localStorage.getItem("activePage");
if (savedPage === "data" || savedPage === "alerts") {
  showPage(savedPage);
}

// ============================================================
// CSV parsing - Column B only, groups of 3 lines per event
// ============================================================
function parseSheetCSV(csvText) {
  const rawLines = csvText.split("\n");

  const values = rawLines.map((line) => {
    const idx = line.indexOf(",");
    const col = idx === -1 ? "" : line.slice(idx + 1);
    return col.replace(/\r/g, "").trim();
  });

  const nonEmpty = values.filter((v) => v.length > 0);
  if (nonEmpty.length === 0) {
    return { header: "", events: [] };
  }

  const header = nonEmpty[0];
  const rest = nonEmpty.slice(1);

  const events = [];
  for (let i = 0; i < rest.length; i += 3) {
    const name = rest[i];
    const countdown = rest[i + 1];
    const date = rest[i + 2];
    if (!name || !countdown) continue;

    const dayMatch = countdown.match(/^(\d+)\s*\.\s*Day Left/i);
    const monthMatch = countdown.match(/^(\d+)\s*\.\s*Months\s*-\s*(\d+)\s*\.\s*Days/i);

    let days = null;
    let isDayFormat = false;
    let isMonthFormat = false;
    let monthsElapsed = null;
    let daysElapsed = null;

    if (dayMatch) {
      days = parseInt(dayMatch[1], 10);
      isDayFormat = true;
    } else if (monthMatch) {
      monthsElapsed = parseInt(monthMatch[1], 10);
      daysElapsed = parseInt(monthMatch[2], 10);
      isMonthFormat = true;
    }

    events.push({ name, countdown, date, days, isDayFormat, isMonthFormat, monthsElapsed, daysElapsed });
  }

  return { header, events };
}

async function fetchSheetData() {
  const response = await fetch(SHEET_CSV_URL, { cache: "no-store" });
  if (!response.ok) throw new Error("Network response was not ok");
  const text = await response.text();
  return parseSheetCSV(text);
}

// ============================================================
// Rendering
// ============================================================
function renderEvents(container, events) {
  container.innerHTML = "";
  events.forEach((e) => {
    const item = document.createElement("div");
    item.className = "event";
    item.innerHTML = `
      <div class="event-name">${e.name}</div>
      <div class="event-countdown">${e.countdown}</div>
      <div class="event-date">${e.date}</div>
    `;
    container.appendChild(item);
  });
}

async function loadAll() {
  const headerAlerts = document.getElementById("header-alerts");
  const listAlerts = document.getElementById("list-alerts");
  const headerData = document.getElementById("header-data");
  const listData = document.getElementById("list-data");

  try {
    const { header, events } = await fetchSheetData();

    headerAlerts.textContent = header;
    headerData.textContent = header;

    // Page 2: all data, as-is
    renderEvents(listData, events);

    // Page 1: 
    // - normal countdown events with <= 15 days left
    // - cylinder-style count-up events once they reach 3 months
    const alerts = events.filter((e) => {
      if (e.isDayFormat && e.days !== null) {
        return e.days <= ALERT_THRESHOLD_DAYS;
      }
      if (e.isMonthFormat && e.monthsElapsed !== null) {
        return e.monthsElapsed >= CYLINDER_THRESHOLD_MONTHS;
      }
      return false;
    });

    if (alerts.length === 0) {
      listAlerts.innerHTML = '<div class="empty-state">No alerts right now.</div>';
    } else {
      renderEvents(listAlerts, alerts);
    }
  } catch (err) {
    const msg = '<div class="empty-state">Could not load data. Please try again later.</div>';
    listAlerts.innerHTML = msg;
    listData.innerHTML = msg;
  }
}

loadAll();
setInterval(loadAll, 3000);

// ============================================================
// Per-line font Settings (size, color, style) - saved forever
// in localStorage until the user changes them again.
// ============================================================
const FONT_TARGETS = ["header", "name", "countdown", "date"];

const DEFAULT_FONT_SETTINGS = {
  header: { size: 19, color: "#000000", font: "inherit" },
  name: { size: 20, color: "#000000", font: "inherit" },
  countdown: { size: 26, color: "#ff0000", font: "inherit" },
  date: { size: 15, color: "#000000", font: "inherit" }
};

function getSavedFontSettings() {
  try {
    const raw = localStorage.getItem("fontSettings");
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) {
    return null;
  }
}

function applyFontSettingsToPage(settings) {
  FONT_TARGETS.forEach((target) => {
    const s = settings[target] || DEFAULT_FONT_SETTINGS[target];
    document.documentElement.style.setProperty(`--${target}-size`, s.size + "px");
    document.documentElement.style.setProperty(`--${target}-color`, s.color);
    document.documentElement.style.setProperty(`--${target}-font`, s.font);
  });
}

function fillSettingsForm(settings) {
  FONT_TARGETS.forEach((target) => {
    const s = settings[target] || DEFAULT_FONT_SETTINGS[target];
    document.getElementById(`${target}-size`).value = s.size;
    document.getElementById(`${target}-color`).value = s.color;
    document.getElementById(`${target}-font`).value = s.font;
  });
}

function openSettings() {
  const current = getSavedFontSettings() || DEFAULT_FONT_SETTINGS;
  fillSettingsForm(current);
  document.getElementById("settingsOverlay").classList.add("open");
}

function closeSettings() {
  document.getElementById("settingsOverlay").classList.remove("open");
}

function applySettings() {
  const settings = {};
  FONT_TARGETS.forEach((target) => {
    settings[target] = {
      size: parseInt(document.getElementById(`${target}-size`).value, 10) || DEFAULT_FONT_SETTINGS[target].size,
      color: document.getElementById(`${target}-color`).value,
      font: document.getElementById(`${target}-font`).value
    };
  });
  localStorage.setItem("fontSettings", JSON.stringify(settings));
  applyFontSettingsToPage(settings);
  closeSettings();
}

function resetSettings() {
  localStorage.removeItem("fontSettings");
  applyFontSettingsToPage(DEFAULT_FONT_SETTINGS);
  fillSettingsForm(DEFAULT_FONT_SETTINGS);
}

// On load: apply any saved font settings immediately (persists forever
// until the user changes it again from the Settings panel).
(function initFontSettings() {
  const saved = getSavedFontSettings();
  if (saved) {
    applyFontSettingsToPage(saved);
  }
})();
</script>
</body>
           </html>
